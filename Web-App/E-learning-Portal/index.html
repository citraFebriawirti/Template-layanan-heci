<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heci.Tech E-Learning Portal — Premium LMS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for reactive state management -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Inter & Plus Jakarta Sans typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { DEFAULT: '#172B4D', dark: '#0F1E36', light: '#223A63' },
                        edu: { DEFAULT: '#356AE6', hover: '#2851C7', light: '#EAF2FF' },
                        surface: { DEFAULT: '#FFFFFF', muted: '#F7F8FA', border: '#DFE1E6' },
                        charcoal: '#252B36',
                        slate: '#697586',
                        success: { DEFAULT: '#18845B', light: '#E6F4EA' },
                        amber: { DEFAULT: '#C47A12', light: '#FEF8EC' },
                        error: { DEFAULT: '#D64545', light: '#FDF2F2' }
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #F7F8FA; }
        ::-webkit-scrollbar-thumb { background: #DFE1E6; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #697586; }
    </style>
</head>
<body class="h-full bg-surface-muted text-charcoal font-sans antialiased selection:bg-edu selection:text-white" x-data="lmsApp()">

    <!-- APP SHELL -->
    <div class="min-h-full flex flex-col">

        <!-- TOP BAR / ROLE SWITCHER BANNER -->
        <header class="bg-navy text-white px-4 py-2.5 flex flex-wrap items-center justify-between gap-4 text-sm z-50 border-b border-navy-light shadow-sm">
            <div class="flex items-center space-x-3">
                <div class="bg-edu text-white font-bold px-2.5 py-1 rounded text-xs tracking-wider uppercase">Heci.Tech LMS</div>
                <span class="text-slate-300 hidden sm:inline">|</span>
                <span class="font-medium text-slate-200">Portal Akademik & Manajemen Pembelajaran</span>
            </div>
            
            <div class="flex items-center space-x-4">
                <div class="flex items-center bg-navy-dark px-3 py-1 rounded-md border border-navy-light">
                    <span class="text-xs text-slate-400 mr-2 uppercase tracking-wide font-semibold">Simulasi Peran (RBAC):</span>
                    <select x-model="currentRole" @change="switchRole(currentRole)" class="bg-transparent text-white font-medium text-xs focus:outline-none cursor-pointer">
                        <option value="student" class="bg-navy text-white">Siswa: Alya Ramadhani</option>
                        <option value="teacher" class="bg-navy text-white">Guru: Budi Santoso, M.Pd</option>
                        <option value="admin" class="bg-navy text-white">Admin: Dr. Hendra Wijaya (Administrator)</option>
                    </select>
                </div>

                <!-- Global Notification Trigger -->
                <div class="relative" x-data="{ open: false }">
                    <button @click="open = !open" class="relative p-1.5 rounded-lg bg-navy-dark hover:bg-navy-light text-slate-200 transition-colors focus:outline-none">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-error rounded-full ring-2 ring-navy"></span>
                    </button>

                    <!-- Notifications Dropdown -->
                    <div x-show="open" @click.away="open = false" x-cloak class="absolute right-0 mt-2 w-80 bg-surface rounded-xl shadow-xl border border-surface-border text-charcoal py-3 z-50">
                        <div class="px-4 pb-2 border-b border-surface-border flex items-center justify-between">
                            <h3 class="font-bold text-xs uppercase tracking-wider text-slate">Notifikasi Terbaru</h3>
                            <span class="text-xs text-edu font-semibold cursor-pointer hover:underline">Tandai dibaca</span>
                        </div>
                        <div class="divide-y divide-surface-border max-h-72 overflow-y-auto">
                            <template x-for="notif in notifications" :key="notif.id">
                                <div class="px-4 py-3 hover:bg-surface-muted transition-colors cursor-pointer" :class="{'bg-edu-light/40': !notif.read}">
                                    <div class="flex items-start justify-between">
                                        <p class="text-xs font-semibold text-charcoal" x-text="notif.title"></p>
                                        <span class="text-[10px] text-slate" x-text="notif.time"></span>
                                    </div>
                                    <p class="text-xs text-slate mt-1" x-text="notif.desc"></p>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- MAIN LAYOUT WRAPPER -->
        <div class="flex-1 flex overflow-hidden">

            <!-- SIDEBAR NAVIGATION -->
            <aside class="w-64 bg-surface border-r border-surface-border flex flex-col z-20 shrink-0 hidden md:flex">
                <!-- Institution Brand -->
                <div class="p-5 border-b border-surface-border flex items-center space-x-3">
                    <div class="w-9 h-9 rounded-xl bg-navy flex items-center justify-center text-white font-bold text-lg shadow-sm">H</div>
                    <div>
                        <h1 class="font-bold text-sm text-navy tracking-tight">SMK Pembangunan Jaya</h1>
                        <p class="text-[11px] text-slate font-medium">Tahun Ajaran 2025/2026 Ganjil</p>
                    </div>
                </div>

                <!-- Role-based Navigation Links -->
                <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto">
                    <p class="px-3 text-[10px] font-bold uppercase tracking-wider text-slate mb-2" x-text="roleTitle"></p>

                    <!-- STUDENT MENU -->
                    <template x-if="currentRole === 'student'">
                        <div class="space-y-1">
                            <a href="#" @click.prevent="activeTab = 'student-dashboard'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'student-dashboard', 'text-charcoal hover:bg-surface-muted': activeTab !== 'student-dashboard'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                <span>Dashboard Utama</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'student-courses'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'student-courses' || activeTab === 'classroom', 'text-charcoal hover:bg-surface-muted': activeTab !== 'student-courses' && activeTab !== 'classroom'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                <span>Kelas Saya</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'student-assignments'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'student-assignments' || activeTab === 'quiz-session', 'text-charcoal hover:bg-surface-muted': activeTab !== 'student-assignments' && activeTab !== 'quiz-session'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                                <span>Tugas & Kuis</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'student-grades'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'student-grades', 'text-charcoal hover:bg-surface-muted': activeTab !== 'student-grades'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <span>Nilai & Progres</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'student-discussion'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'student-discussion', 'text-charcoal hover:bg-surface-muted': activeTab !== 'student-discussion'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z"></path></svg>
                                <span>Diskusi Kelas</span>
                            </a>
                        </div>
                    </template>

                    <!-- TEACHER MENU -->
                    <template x-if="currentRole === 'teacher'">
                        <div class="space-y-1">
                            <a href="#" @click.prevent="activeTab = 'teacher-dashboard'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'teacher-dashboard', 'text-charcoal hover:bg-surface-muted': activeTab !== 'teacher-dashboard'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                <span>Dashboard Guru</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'teacher-classes'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'teacher-classes', 'text-charcoal hover:bg-surface-muted': activeTab !== 'teacher-classes'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                <span>Kelas & Materi</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'teacher-grading'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'teacher-grading', 'text-charcoal hover:bg-surface-muted': activeTab !== 'teacher-grading'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                                <span>Penilaian Tugas</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'teacher-quizbuilder'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'teacher-quizbuilder', 'text-charcoal hover:bg-surface-muted': activeTab !== 'teacher-quizbuilder'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span>Bank Soal & Kuis</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'teacher-export'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'teacher-export', 'text-charcoal hover:bg-surface-muted': activeTab !== 'teacher-export'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                <span>Rekap Nilai Excel</span>
                            </a>
                        </div>
                    </template>

                    <!-- ADMIN MENU -->
                    <template x-if="currentRole === 'admin'">
                        <div class="space-y-1">
                            <a href="#" @click.prevent="activeTab = 'admin-dashboard'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'admin-dashboard', 'text-charcoal hover:bg-surface-muted': activeTab !== 'admin-dashboard'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                                <span>Dashboard Admin</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'admin-import'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'admin-import', 'text-charcoal hover:bg-surface-muted': activeTab !== 'admin-import'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                                <span>Impor Data Excel</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'admin-users'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'admin-users', 'text-charcoal hover:bg-surface-muted': activeTab !== 'admin-users'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                                <span>Manajemen Pengguna</span>
                            </a>
                            <a href="#" @click.prevent="activeTab = 'admin-monitoring'" :class="{'bg-edu text-white font-semibold shadow-sm': activeTab === 'admin-monitoring', 'text-charcoal hover:bg-surface-muted': activeTab !== 'admin-monitoring'}" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                                <span>Monitoring Belajar</span>
                            </a>
                        </div>
                    </template>
                </nav>

                <!-- User Profile Mini Footer -->
                <div class="p-4 border-t border-surface-border bg-surface-muted/50 flex items-center justify-between">
                    <div class="flex items-center space-x-3">
                        <div class="w-9 h-9 rounded-full bg-edu text-white font-bold flex items-center justify-center text-xs" x-text="userAvatar"></div>
                        <div class="overflow-hidden">
                            <p class="text-xs font-bold text-charcoal truncate" x-text="userName"></p>
                            <p class="text-[11px] text-slate truncate" x-text="userEmail"></p>
                        </div>
                    </div>
                </div>
            </aside>

            <!-- MAIN CONTENT AREA -->
            <main class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-surface-muted">
                
                <!-- MOBILE HEADER -->
                <header class="bg-surface border-b border-surface-border px-4 py-3 flex items-center justify-between md:hidden">
                    <div class="flex items-center space-x-2">
                        <div class="w-7 h-7 rounded-lg bg-navy text-white font-bold flex items-center justify-center text-xs">H</div>
                        <span class="font-bold text-sm text-navy">Heci.Tech LMS</span>
                    </div>
                    <div class="text-xs font-semibold px-2.5 py-1 bg-edu-light text-edu rounded-md" x-text="roleTitle"></div>
                </header>

                <!-- DYNAMIC VIEW CONTAINER -->
                <div class="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">

                    <!------------------------------------------------ -->
                    <!-- 1. STUDENT DASHBOARD & VIEWS                 -->
                    <!------------------------------------------------ -->
                    <template x-if="currentRole === 'student'">
                        <div class="space-y-6">

                            <!-- TAB 1: STUDENT MAIN DASHBOARD -->
                            <div x-show="activeTab === 'student-dashboard'" class="space-y-6">
                                <!-- Greeting Header -->
                                <div class="bg-surface rounded-2xl p-6 border border-surface-border shadow-xs flex flex-col md:flex-row md:items-center justify-between gap-4">
                                    <div>
                                        <p class="text-xs font-semibold text-edu uppercase tracking-wider mb-1">Selamat Pagi, Alya Ramadhani</p>
                                        <h2 class="text-2xl font-bold text-navy tracking-tight">Siap melanjutkan progres belajarmu hari ini?</h2>
                                        <p class="text-xs text-slate mt-1">Anda memiliki 2 tugas yang mendekati deadline dan 1 modul baru di kelas Pemrograman Web.</p>
                                    </div>
                                    <div class="flex items-center space-x-3 bg-surface-muted px-4 py-3 rounded-xl border border-surface-border">
                                        <div class="w-10 h-10 rounded-full bg-success/10 text-success flex items-center justify-center font-bold text-sm">84%</div>
                                        <div>
                                            <p class="text-[11px] text-slate font-medium uppercase">Rata-rata Nilai</p>
                                            <p class="text-xs font-bold text-charcoal">Sangat Memuaskan</p>
                                        </div>
                                    </div>
                                </div>

                                <!-- Learning Overview Metrics -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    <div class="bg-surface p-5 rounded-xl border border-surface-border shadow-xs">
                                        <p class="text-xs font-semibold text-slate uppercase">Kelas Aktif</p>
                                        <div class="flex items-baseline justify-between mt-2">
                                            <span class="text-2xl font-bold text-navy">5</span>
                                            <span class="text-xs text-success font-semibold">Semua Aktif</span>
                                        </div>
                                    </div>
                                    <div class="bg-surface p-5 rounded-xl border border-surface-border shadow-xs">
                                        <p class="text-xs font-semibold text-slate uppercase">Materi Selesai</p>
                                        <div class="flex items-baseline justify-between mt-2">
                                            <span class="text-2xl font-bold text-navy">38/45</span>
                                            <span class="text-xs text-edu font-semibold">84% Selesai</span>
                                        </div>
                                    </div>
                                    <div class="bg-surface p-5 rounded-xl border border-surface-border shadow-xs">
                                        <p class="text-xs font-semibold text-slate uppercase">Tugas Pending</p>
                                        <div class="flex items-baseline justify-between mt-2">
                                            <span class="text-2xl font-bold text-amber">2</span>
                                            <span class="text-xs text-amber font-semibold">Segera Kerjakan</span>
                                        </div>
                                    </div>
                                    <div class="bg-surface p-5 rounded-xl border border-surface-border shadow-xs">
