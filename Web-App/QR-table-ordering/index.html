<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kala Resto & Bar | Heci.Tech QR Ordering System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        charcoal: '#20231F',
                        warmIvory: '#F8F6F0',
                        forestGreen: '#315C46',
                        forestHover: '#264937',
                        terracotta: '#C76D4B',
                        slateGray: '#72776F',
                        softRed: '#D9534F',
                        softAmber: '#F0AD4E',
                        softBlue: '#0275D8',
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #F8F6F0;
            color: #20231F;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
        /* Custom scrollbar for horizontal categories */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes pulse-subtle {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .animate-pulse-subtle {
            animation: pulse-subtle 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
</head>
<body class="bg-[#F8F6F0] text-[#20231F] min-h-screen flex flex-col selection:bg-[#315C46] selection:text-white">

    <!-- Global Header / Role Switcher Bar for Demo Presentation -->
    <header class="bg-[#20231F] text-white px-4 py-2 text-xs flex flex-wrap items-center justify-between gap-2 border-b border-[#333732] z-50">
        <div class="flex items-center gap-2">
            <span class="bg-[#315C46] text-[#F8F6F0] px-2 py-0.5 rounded font-bold tracking-wide">Heci.Tech</span>
            <span class="text-[#F8F6F0]/80">Kala Resto & Bar • QR Table Ordering & POS</span>
        </div>
        <div class="flex items-center gap-3">
            <span class="text-xs text-[#72776F] hidden sm:inline">Demo Role Switcher:</span>
            <div id="role-switcher-buttons" class="flex items-center gap-1 bg-[#2D312C] p-1 rounded-lg border border-[#3E433D]">
                <button onclick="switchRole('customer')" id="btn-role-customer" class="px-2.5 py-1 rounded text-xs font-semibold transition bg-[#315C46] text-white">📱 Pelanggan (Meja 04)</button>
                <button onclick="switchRole('waiter')" id="btn-role-waiter" class="px-2.5 py-1 rounded text-xs font-semibold transition text-gray-300 hover:text-white">🛎️ Pelayan</button>
                <button onclick="switchRole('kitchen')" id="btn-role-kitchen" class="px-2.5 py-1 rounded text-xs font-semibold transition text-gray-300 hover:text-white">🍳 Dapur / KDS</button>
                <button onclick="switchRole('cashier')" id="btn-role-cashier" class="px-2.5 py-1 rounded text-xs font-semibold transition text-gray-300 hover:text-white">💵 Kasir</button>
                <button onclick="switchRole('admin')" id="btn-role-admin" class="px-2.5 py-1 rounded text-xs font-semibold transition text-gray-300 hover:text-white">⚙️ Admin</button>
            </div>
            <button onclick="resetDemoData()" title="Reset Session & Data" class="text-xs text-red-400 hover:text-red-300 px-2 py-1 bg-red-950/40 rounded border border-red-900/50">Reset Demo</button>
        </div>
    </header>

    <main id="app-container" class="flex-1 flex flex-col relative">
        <!-- Injected via JavaScript based on current role -->
    </main>

    <!-- Global Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Global Modal Container -->
    <div id="modal-container" class="fixed inset-0 z-50 hidden bg-black/60 backdrop-blur-sm flex items-center justify-center p-4"></div>

    <script>
        // --- MOCK DATABASE & STATE ---

                    price: 115000,
                    image: 'https://images.unsplash.com/photo-1473093226795-af9932fe5856?q=80&w=600&auto=format&fit=crop',
                    isBestSeller: false,

                    variants: [

                    ],

                    name: 'Crispy Truffle Fries',

                    price: 45000,

                },
                {

                    name: 'Baileys Tiramisu Cake',
                    description: 'Kue tiramisu lembut dengan aroma kopi pekat dan sentuhan liqueur baileys (non-alkohol available).',
                    price: 52000,
                    image: 'https://images.unsplash.com/photo-1571115177098-24ec42ed204d?q=80&w=600&auto=format&fit=crop',
                    isBestSeller: false,
                    isNew: false,
                    isAvailable: true,
                    station: 'bar',
                    variants: [],
                    addOns: []
                }
            ],
            cart: [],
            orders: [
                {
                    id: 'ORD-9821',
                    tableNo: '04',
                    tableName: 'Meja VIP 04',
                    createdAt: new Date(Date.now() - 30 * 60000).toISOString(),
                    status: 'ready', // received, cooking, ready, delivered
                    items: [
                        { productName: 'Kala Signature Latte', quantity: 2, variant: 'Ice, Less Sugar', addOns: ['Extra Espresso Shot'], price: 50000, station: 'bar', status: 'ready' },
                        { productName: 'Truffle Mushroom Wagyu Bowl', quantity: 1, variant: 'Onsen Egg, Normal Rice', addOns: [], price: 95000, station: 'kitchen', status: 'ready' }
                    ],
                    total: 195000,
                    paymentStatus: 'unpaid'
                },
                {
                    id: 'ORD-9825',
                    tableNo: '02',
                    tableName: 'Meja Regular 02',
                    createdAt: new Date(Date.now() - 12 * 60000).toISOString(),
                    status: 'cooking',
                    items: [
                        { productName: 'Salmon Truffle Pesto Pasta', quantity: 1, variant: 'Fettuccine', addOns: ['Extra Garlic Bread'], price: 130000, station: 'kitchen', status: 'cooking' }
                    ],
                    total: 130000,
                    paymentStatus: 'unpaid'
                }
            ],
            tables: [
                { no: '01', name: 'Meja Regular 01', status: 'empty', capacity: 2, session: null },
                { no: '02', name: 'Meja Regular 02', status: 'occupied', capacity: 4, session: { guestCount: 3, openedAt: new Date(Date.now() - 20 * 60000).toISOString(), totalBill: 130000 } },
                { no: '03', name: 'Meja Regular 03', status: 'empty', capacity: 4, session: null },
                { no: '04', name: 'Meja VIP 04', status: 'occupied', capacity: 6, session: { guestCount: 3, openedAt: new Date(Date.now() - 45 * 60000).toISOString(), totalBill: 195000 } },
                { no: '05', name: 'Meja Outdoor 01', status: 'payment_pending', capacity: 2, session: { guestCount: 2, openedAt: new Date(Date.now() - 75 * 60000).toISOString(), totalBill: 184000 } },
                { no: '06', name: 'Meja Outdoor 02', status: 'empty', capacity: 2, session: null }
            ],
            serviceRequests: [
                { id: 'sr-1', tableNo: '04', type: 'bill', message: 'Minta Bill / Pembayaran', createdAt: new Date(Date.now() - 5 * 60000).toISOString(), status: 'pending' },
                { id: 'sr-2', tableNo: '02', type: 'waiter', message: 'Panggil Pelayan (Bantuan)', createdAt: new Date(Date.now() - 15 * 60000).toISOString(), status: 'resolved' }
            ],
            customerActiveTab: 'menu', // menu, orders, bill
            selectedCategory: 'cat-1',
            searchQuery: '',
            selectedProductForModal: null,
            modalConfig: { isOpen: false, type: null, data: null }
        };

        let appState = JSON.parse(JSON.stringify(INITIAL_STATE));

        // --- UTILITY FUNCTIONS ---
        function formatIDR(amount) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(amount);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgCol = type === 'success' ? 'bg-[#315C46]' : type === 'error' ? 'bg-[#D9534F]' : 'bg-[#20231F]';
            toast.className = `${bgCol} text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transform transition-all duration-300 translate-y-2 opacity-0 pointer-events-auto border border-white/10`;
            
            let iconName = type === 'success' ? 'check-circle' : type === 'error' ? 'alert-triangle' : 'info';
            toast.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5 shrink-0"></i><span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('translate-y-2', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function switchRole(role) {
            appState.currentRole = role;
            // Update button styles in header
            ['customer', 'waiter', 'kitchen', 'cashier', 'admin'].forEach(r => {
                const btn = document.getElementById(`btn-role-${r}`);
                if (btn) {
                    if (r === role) {
                        btn.className = "px-2.5 py-1 rounded text-xs font-semibold transition bg-[#315C46] text-white shadow-sm";
                    } else {
                        btn.className = "px-2.5 py-1 rounded text-xs font-semibold transition text-gray-300 hover:text-white bg-transparent";
                    }
                }
            });
            renderApp();
            showToast(`Beralih peran ke: ${role.toUpperCase()}`, 'info');
        }

        function resetDemoData() {
            appState = JSON.parse(JSON.stringify(INITIAL_STATE));
            renderApp();
            showToast('Data demo berhasil direset ke kondisi awal', 'success');
        }

        // --- RENDER ROUTER ---
        function renderApp() {
            const container = document.getElementById('app-container');
            container.innerHTML = '';

            switch (appState.currentRole) {
                case 'customer':
                    container.innerHTML = renderCustomerApp();
                    break;
                case 'waiter':
                    container.innerHTML = renderWaiterApp();
                    break;
                case 'kitchen':
                    container.innerHTML = renderKitchenApp();
                    break;
                case 'cashier':
                    container.innerHTML = renderCashierApp();
                    break;
                case 'admin':
                    container.innerHTML = renderAdminApp();
                    break;
                default:
                    container.innerHTML = renderCustomerApp();
            }
            lucide.createIcons();
        }

        // ==========================================
        // 1. CUSTOMER ORDERING EXPERIENCE (MOBILE FIRST)
        // ==========================================
        function renderCustomerApp() {
            return `
                <div class="max-w-md mx-auto w-full bg-[#F8F6F0] min-h-screen flex flex-col shadow-2xl relative border-x border-stone-200">
                    <!-- Customer Top Bar / Restaurant Header -->
                    <div class="bg-[#20231F] text-[#F8F6F0] px-5 py-4 sticky top-0 z-30 shadow-md flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-[#315C46] flex items-center justify-center font-bold text-lg text-white shadow">K</div>
                            <div>
                                <h1 class="font-bold text-base tracking-tight leading-snug">Kala Resto & Bar</h1>
                                <p class="text-xs text-[#72776F] flex items-center gap-1.5">
                                    <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                                    ${appState.tableSession.tableName} • Sesi Aktif
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="openTableQRModal()" class="p-2 rounded-xl bg-[#2D312C] text-[#F8F6F0] hover:bg-[#3E433D] transition border border-[#3E433D]" title="Info QR Meja">
                                <i data-lucide="qr-code" class="w-5 h-5 text-emerald-400"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Customer Navigation Tabs -->
                    <div class="bg-white border-b border-stone-200 px-4 py-2 flex items-center justify-around sticky top-[73px] z-20 shadow-xs">
                        <button onclick="setCustomerTab('menu')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl font-semibold text-xs transition ${appState.customerActiveTab === 'menu' ? 'bg-[#315C46] text-white shadow-sm' : 'text-stone-600 hover:bg-stone-100'}">
                            <i data-lucide="utensils" class="w-4 h-4"></i> Menu
                        </button>
                        <button onclick="setCustomerTab('orders')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl font-semibold text-xs transition relative ${appState.customerActiveTab === 'orders' ? 'bg-[#315C46] text-white shadow-sm' : 'text-stone-600 hover:bg-stone-100'}">
                            <i data-lucide="clock" class="w-4 h-4"></i> Pesanan Saya
                            ${getTabOrderBadge()}
                        </button>
                        <button onclick="setCustomerTab('bill')" class="flex items-center gap-1.5 px-4 py-2 rounded-xl font-semibold text-xs transition ${appState.customerActiveTab === 'bill' ? 'bg-[#315C46] text-white shadow-sm' : 'text-stone-600 hover:bg-stone-100'}">
                            <i data-lucide="receipt" class="w-4 h-4"></i> Tagihan Meja
                        </button>
                    </div>

                    <!-- Customer Tab Contents -->
                    <div class="flex-1 pb-28">
                        ${appState.customerActiveTab === 'menu' ? renderCustomerMenuTab() : ''}
                        ${appState.customerActiveTab === 'orders' ? renderCustomerOrdersTab() : ''}
                        ${appState.customerActiveTab === 'bill' ? renderCustomerBillTab() : ''}
                    </div>

                    <!-- Customer Sticky Action Bar / Floating Cart Bar -->
                    ${appState.customerActiveTab === 'menu' && appState.cart.length > 0 ? renderCartStickyBar() : ''}

                    <!-- Customer Bottom Action Bar (Call Waiter / Bill) -->
                    <div class="bg-white border-t border-stone-200 px-4 py-3 sticky bottom-0 z-30 flex items-center justify-between gap-3 shadow-lg">
                        <button onclick="triggerServiceRequest('waiter')" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border border-stone-300 text-stone-700 font-semibold text-xs hover:bg-stone-50 transition active:scale-95">
                            <i data-lucide="bell" class="w-4 h-4 text-[#315C46]"></i> Panggil Pelayan
                        </button>
                        <button onclick="triggerServiceRequest('bill')" class="flex-1 flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-[#20231F] text-white font-semibold text-xs hover:bg-black transition active:scale-95 shadow-sm">
                            <i data-lucide="file-text" class="w-4 h-4 text-emerald-400"></i> Minta Bill
                        </button>
                    </div>
                </div>
            `;
        }

        function setCustomerTab(tab) {
            appState.customerActiveTab = tab;
            renderApp();
        }

        function getTabOrderBadge() {
            const activeOrders = appState.orders.filter(o => o.tableNo === appState.tableSession.tableNo);
            if (activeOrders.length === 0) return '';
            return `<span class="absolute -top-1 -right-1 bg-[#C76D4B] text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold shadow">${activeOrders.length}</span>`;
        }

        function renderCustomerMenuTab() {
            const filteredProducts = appState.products.filter(p => {
                const matchCategory = p.categoryId === appState.selectedCategory;
                const matchSearch = p.name.toLowerCase().includes(appState.searchQuery.toLowerCase()) || p.description.toLowerCase().includes(appState.searchQuery.toLowerCase());
                return matchCategory && matchSearch;
            });

            return `
                <!-- Search Bar -->
                <div class="px-4 pt-4 pb-2">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-stone-400"></i>
                        <input type="text" value="${appState.searchQuery}" oninput="handleSearchInput(event)" placeholder="Cari menu nikmat di Kala..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-stone-200 text-xs focus:outline-none focus:border-[#315C46] shadow-xs">
                    </div>
                </div>

                <!-- Category Slider -->
                <div class="px-4 py-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
                    ${appState.categories.map(cat => `
                        <button onclick="selectCategory('${cat.id}')" class="px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition flex items-center gap-2 shrink-0 ${appState.selectedCategory === cat.id ? 'bg-[#315C46] text-white shadow-sm' : 'bg-white text-stone-600 border border-stone-200 hover:bg-stone-50'}">
                            <i data-lucide="${cat.icon}" class="w-4 h-4"></i> ${cat.name}
                        </button>
                    `).join('')}
                </div>

                <!-- Product Grid List -->
                <div class="px-4 py-3 grid grid-cols-1 gap-3">
                    ${filteredProducts.length === 0 ? `
                        <div class="text-center py-12 bg-white rounded-2xl border border-stone-200 p-6">
                            <i data-lucide="coffee" class="w-10 h-10 mx-auto text-stone-300 mb-2"></i>
                            <p class="text-stone-600 font-medium text-sm">Tidak ada menu ditemukan</p>
                            <p class="text-xs text-stone-400 mt-1">Coba kata kunci lain atau pilih kategori berbeda</p>
                        </div>
                    ` : filteredProducts.map(prod => `
                        <div onclick="${prod.isAvailable ? `openProductDetail('${prod.id}')` : ''}" class="bg-white rounded-2xl p-3.5 border border-stone-200 shadow-xs flex gap-3.5 items-center transition relative ${prod.isAvailable ? 'cursor-pointer hover:border-[#315C46]/50 hover:shadow-md' : 'opacity-60 bg-stone-50'}">
                            <div class="relative w-24 h-24 rounded-xl overflow-hidden shrink-0 bg-stone-100">
                                <img src="${prod.image}" alt="${prod.name}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/300x300/F8F6F0/72776F?text=Kala+Menu'">
                                ${!prod.isAvailable ? `<div class="absolute inset-0 bg-black/50 flex items-center justify-center"><span class="bg-red-600 text-white text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider">Habis</span></div>` : ''}
                                ${prod.isBestSeller && prod.isAvailable ? `<span class="absolute top-1.5 left-1.5 bg-[#C76D4B] text-white text-[9px] font-bold px-1.5 py-0.5 rounded shadow">Best Seller</span>` : ''}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-start justify-between gap-2">
                                    <h3 class="font-bold text-sm text-[#20231F] truncate">${prod.name}</h3>
                                </div>
                                <p class="text-xs text-[#72776F] line-clamp-2 mt-1 leading-relaxed">${prod.description}</p>
                                <div class="mt-2.5 flex items-center justify-between">
                                    <span class="font-extrabold text-sm text-[#315C46] tabular-nums">${formatIDR(prod.price)}</span>
                                    ${prod.isAvailable ? `
                                        <button onclick="event.stopPropagation(); openProductDetail('${prod.id}')" class="w-8 h-8 rounded-xl bg-[#315C46] text-white flex items-center justify-center hover:bg-[#264937] transition shadow-sm">

        // --- PRODUCT DETAIL MODAL ---
        function openProductDetail(productId) {
            const product = appState.products.find(p => p.id === productId);
            if (!product) return;

            appState.selectedProductForModal = {
                product: product,
                quantity: 1,
                selectedVariants: {},
                selectedAddOns: [],
                notes: ''
            };

            // Init default variant choices
            product.variants.forEach(v => {
                if (v.options.length > 0) {
                    appState.selectedProductForModal.selectedVariants[v.name] = v.options[0].label;
                }
            });

            renderModal(renderProductDetailModalContent());
        }

        function renderProductDetailModalContent() {
            const sel = appState.selectedProductForModal;
            if (!sel) return '';
            const prod = sel.product;

            // Calculate current item price
            let calculatedPrice = prod.price;
            sel.selectedAddOns.forEach(aoId => {
                const ao = prod.addOns.find(a => a.id === aoId);
                if (ao) calculatedPrice += ao.price;
            });
            // check variant price add
            Object.entries(sel.selectedVariants).forEach(([vName, optLabel]) => {
                const vGroup = prod.variants.find(vg => vg.name === vName);
                if (vGroup) {
                    const opt = vGroup.options.find(o => o.label === optLabel);
                    if (opt) calculatedPrice += opt.price;
                }
            });

            const finalItemTotal = calculatedPrice * sel.quantity;

            return `
                <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-stone-200 flex flex-col max-h-[90vh]">
                    <div class="relative h-56 bg-stone-100">
                        <img src="${prod.image}" alt="${prod.name}" class="w-full h-full object-cover">
                        <button onclick="closeModal()" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-black/60 text-white flex items-center justify-center backdrop-blur hover:bg-black transition">
                            <i data-lucide="x" class="w-5 h-5"></i>
                        </button>
                    </div>
                    <div class="p-6 overflow-y-auto flex-1 space-y-5">
                        <div>
                            <div class="flex items-center justify-between gap-2">
                                <h2 class="font-extrabold text-xl text-[#20231F]">${prod.name}</h2>
                                <span class="font-extrabold text-lg text-[#315C46] tabular-nums">${formatIDR(prod.price)}</span>
                            </div>
                            <p class="text-xs text-[#72776F] mt-2 leading-relaxed">${prod.description}</p>
                        </div>

                        <!-- Variants selection -->
                        ${prod.variants.map(v => `
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-[#20231F] uppercase tracking-wider">${v.name} <span class="text-emerald-600">*Wajib</span></label>
                                <div class="grid grid-cols-2 gap-2">
                                    ${v.options.map(opt => `
                                        <button type="button" onclick="setProductVariant('${v.name}', '${opt.label}')" class="px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition text-left flex items-center justify-between ${sel.selectedVariants[v.name] === opt.label ? 'border-[#315C46] bg-[#315C46]/10 text-[#315C46]' : 'border-stone-200 bg-white text-stone-700 hover:border-stone-300'}">
                                            <span>${opt.label}</span>
                                            ${sel.selectedVariants[v.name] === opt.label ? '<i data-lucide="check" class="w-4 h-4 text-[#315C46]"></i>' : ''}
                                        </button>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}

                        <!-- Add-ons selection -->
                        ${prod.addOns.length > 0 ? `
                            <div class="space-y-2">
                                <label class="text-xs font-bold text-[#20231F] uppercase tracking-wider">Tambah Topping / Add-on (Opsional)</label>
                                <div class="space-y-2">
                                    ${prod.addOns.map(ao => {
                                        const isChecked = sel.selectedAddOns.includes(ao.id);
                                        return `
                                            <div onclick="toggleProductAddOn('${ao.id}')" class="px-3.5 py-2.5 rounded-xl border text-xs font-semibold transition flex items-center justify-between cursor-pointer ${isChecked ? 'border-[#315C46] bg-[#315C46]/10 text-[#315C46]' : 'border-stone-200 bg-white text-stone-700 hover:border-stone-300'}">
                                                <div class="flex items-center gap-2.5">
                                                    <div class="w-4 h-4 rounded border flex items-center justify-center ${isChecked ? 'bg-[#315C46] border-[#315C46] text-white' : 'border-stone-300'}">
                                                        ${isChecked ? '<i data-lucide="check" class="w-3 h-3"></i>' : ''}
                                                    </div>
                                                    <span>${ao.name}</span>
                                                </div>
                                                <span class="tabular-nums text-stone-500">+${formatIDR(ao.price)}</span>
                                            </div>
                                        `;
                                    }).join('')}
                                </div>
                            </div>
                        ` : ''}

                        <!-- Special Notes -->
                        <div class="space-y-2">
                            <label class="text-xs font-bold text-[#20231F] uppercase tracking-wider">Catatan Khusus untuk Dapur</label>
                            <input type="text" id="modal-item-notes" value="${sel.notes}" oninput="updateModalNotes(event)" placeholder="Contoh: Saus dipisah, jangan pakai bawang..." class="w-full px-4 py-2.5 rounded-xl border border-stone-200 text-xs focus:outline-none focus:border-[#315C46]">
                        </div>
                    </div>

                    <!-- Modal Footer (Quantity & Add to Cart) -->
                    <div class="p-4 bg-stone-50 border-t border-stone-200 flex items-center gap-4">
                        <div class="flex items-center border border-stone-300 rounded-xl bg-white overflow-hidden shadow-xs">
                            <button onclick="updateModalQuantity(-1)" class="w-10 h-10 flex items-center justify-center text-stone-600 hover:bg-stone-100 transition text-base font-bold">-</button>
                            <span class="w-10 text-center font-bold text-sm tabular-nums">${sel.quantity}</span>
                            <button onclick="updateModalQuantity(1)" class="w-10 h-10 flex items-center justify-center text-stone-600 hover:bg-stone-100 transition text-base font-bold">+</button>

                        <button onclick="addToCartConfirmed()" class="flex-1 py-3 px-4 rounded-xl bg-[#315C46] text-white font-bold text-xs hover:bg-[#264937] transition shadow-md flex items-center justify-between">
                            <span>+ Masukkan Keranjang</span>
                            <span class="tabular-nums">${formatIDR(finalItemTotal)}</span>
                        </button>
                    </div>
                </div>
            `;
        }

        function setProductVariant(vName, optLabel) {
            appState.selectedProductForModal.selectedVariants[vName] = optLabel;
            renderModal(renderProductDetailModalContent());
        }

        function toggleProductAddOn(aoId) {
            const idx = appState.selectedProductForModal.selectedAddOns.indexOf(aoId);
            if (idx > -1) {
                appState.selectedProductForModal.selectedAddOns.splice(idx, 1);
            } else {
                appState.selectedProductForModal.selectedAddOns.push(aoId);
            }
            renderModal(renderProductDetailModalContent());
        }

        function updateModalNotes(e) {
            appState.selectedProductForModal.notes = e.target.value;
        }

        function updateModalQuantity(delta) {
            appState.selectedProductForModal.quantity = Math.max(1, appState.selectedProductForModal.quantity + delta);
            renderModal(renderProductDetailModalContent());
        }

        function addToCartConfirmed() {
            const sel = appState.selectedProductForModal;
            const prod = sel.product;

            let unitPrice = prod.price;
            sel.selectedAddOns.forEach(aoId => {
                const ao = prod.addOns.find(a => a.id === aoId);
                if (ao) unitPrice += ao.price;
            });
            Object.entries(sel.selectedVariants).forEach(([vName, optLabel]) => {
                const vGroup = prod.variants.find(vg => vg.name === vName);
                if (vGroup) {
                    const opt = vGroup.options.find(o => o.label === optLabel);
                    if (opt) unitPrice += opt.price;
                }
            });

            const variantDesc = Object.entries(sel.selectedVariants).map(([k, v]) => `${v}`).join(', ');
            const addOnNames = sel.selectedAddOns.map(aoId => {
                const ao = prod.addOns.find(a => a.id === aoId);
                return ao ? ao.name : '';
            });

            const cartItem = {
                cartId: 'ci-' + Date.now() + Math.random().toString(36).substr(2, 4),
                productId: prod.id,
                productName: prod.name,
                image: prod.image,
                unitPrice: unitPrice,
                quantity: sel.quantity,
                totalPrice: unitPrice * sel.quantity,
                variant: variantDesc,
                addOns: addOnNames,
                notes: sel.notes,
                station: prod.station
            };

            appState.cart.push(cartItem);
            closeModal();
            showToast(`${prod.name} (${sel.quantity}x) ditambahkan ke keranjang`);
            renderApp();
        }

            renderModal(renderCartModalContent());

            const subtotal = appState.cart.reduce((sum, item) => sum + item.totalPrice, 0);

            return `
                <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl border border-stone-200 flex flex-col max-h-[90vh]">

                        <div class="flex items-center gap-2">
                            <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-400"></i>
                            <h2 class="font-bold text-sm">Keranjang Pesanan Meja ${appState.tableSession.tableNo}</h2>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-white/10 flex items-center justify-center hover:bg-white/20 transition">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>

                    <div class="p-6 overflow-y-auto flex-1 space-y-4">
                        ${appState.cart.length === 0 ? `
                            <div class="text-center py-10">
                                <i data-lucide="shopping-cart" class="w-12 h-12 mx-auto text-stone-300 mb-2"></i>
                                <p class="text-stone-600 font-medium text-sm">Keranjang Anda masih kosong</p>
                            </div>
                        ` : appState.cart.map(item => `
                            <div class="flex items-start justify-between gap-3 p-3.5 rounded-2xl bg-stone-50 border border-stone-200">
                                <img src="${item.image}" alt="${item.productName}" class="w-16 h-16 rounded-xl object-cover shrink-0 bg-stone-200">
                                <div class="flex-1 min-w-0">
                                    <h4 class="font-bold text-xs text-[#20231F] truncate">${item.productName}</h4>
                                    ${item.variant ? `<p class="text-[11px] text-stone-500">${item.variant}</p>` : ''}
                                    ${item.addOns.length > 0 ? `<p class="text-[11px] text-[#315C46]">+ ${item.addOns.join(', ')}</p>` : ''}
                                    ${item.notes ? `<p class="text-[11px] text-amber-600 italic">Catatan: "${item.notes}"</p>` : ''}
                                    <div class="mt-2 flex items-center justify-between">
                                        <span class="font-extrabold text-xs text-[#315C46] tabular-nums">${formatIDR(item.totalPrice)}</span>
                                        <div class="flex items-center gap-2 bg-white border border-stone-300 rounded-lg px-2 py-1">
                                            <button onclick="modifyCartQty('${item.cartId}', -1)" class="text-stone-600 font-bold text-xs px-1">-</button>
                                            <span class="text-xs font-bold tabular-nums">${item.quantity}</span>
                                            <button onclick="modifyCartQty('${item.cartId}', 1)" class="text-stone-600 font-bold text-xs px-1">+</button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        `).join('')}

                        ${appState.cart.length > 0 ? `
                            <div class="border-t border-stone-200 pt-4 space-y-2 text-xs">
                                <div class="flex justify-between text-stone-600">
                                    <span>Subtotal (${appState.cart.reduce((s, i) => s + i.quantity, 0)} item)</span>
                                    <span class="tabular-nums font-semibold">${formatIDR(subtotal)}</span>
                                </div>
                                <div class="flex justify-between text-stone-600">
                                    <span>PB1 Tax (10%)</span>
                                    <span class="tabular-nums font-semibold">${formatIDR(tax)}</span>
                                </div>
                                <div class="flex justify-between text-stone-600">
                                    <span>Service Charge (5%)</span>
                                    <span class="tabular-nums font-semibold">${formatIDR(serviceCharge)}</span>
                                </div>
                                <div class="flex justify-between text-[#20231F] font-extrabold text-sm pt-2 border-t border-dashed border-stone-300">
                                    <span>Total Tagihan</span>
                                    <span class="tabular-nums text-[#315C46]">${formatIDR(total)}</span>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    ${appState.cart.length > 0 ? `
                        <div class="p-4 bg-stone-50 border-t border-stone-200">
                            <button onclick="submitCartOrder()" class="w-full py-3.5 rounded-xl bg-[#315C46] text-white font-bold text-xs hover:bg-[#264937] transition shadow-md flex items-center justify-center gap-2">
                                <i data-lucide="send" class="w-4 h-4"></i> Kirim Pesanan ke Dapur & Bar
                            </button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function modifyCartQty(cartId, delta) {
            const idx = appState.cart.findIndex(i => i.cartId === cartId);
            if (idx > -1) {
                appState.cart[idx].quantity += delta;
                if (appState.cart[idx].quantity <= 0) {
                    appState.cart.splice(idx, 1);
                } else {
                    appState.cart[idx].totalPrice = appState.cart[idx].unitPrice * appState.cart[idx].quantity;
                }
            }
            if (appState.cart.length === 0) {
                closeModal();
            } else {
                renderModal(renderCartModalContent());
            }
            renderApp();
        }

        function submitCartOrder() {
            if (appState.cart.length === 0) return;

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                tableNo: appState.tableSession.tableNo,
                tableName: appState.tableSession.tableName,
                createdAt: new Date().toISOString(),
                status: 'received',
                items: JSON.parse(JSON.stringify(appState.cart)),
                total: appState.cart.reduce((s, i) => s + i.totalPrice, 0),
                paymentStatus: 'unpaid'
            };

            appState.orders.unshift(newOrder);

            // Update table bill in tables
            const tbl = appState.tables.find(t => t.no === appState.tableSession.tableNo);
            if (tbl && tbl.session) {
                tbl.session.totalBill = (tbl.session.totalBill || 0) + newOrder.total;
            }

            appState.cart = [];
            closeModal();
            showToast('Pesanan berhasil dikirim ke dapur dan bar!', 'success');
            appState.customerActiveTab = 'orders';
            renderApp();
        }

                                                    <span class="px-2.5 py-1 rounded-full font-bold text-[10px] bg-[#315C46]/10 text-[#315C46]">${tableOrders.length} Pesanan</span>
                                                </div>
                                                <div class="mt-3 space-y-1 text-xs text-stone-600">
                                                    <div class="flex justify-between">
                                                        <span>Subtotal:</span>
                                                        <span class="tabular-nums font-semibold">${formatIDR(subtotal)}</span>
                                                    </div>
                                                    <div class="flex justify-between">
                                                        <span>PB1 + Service (15%):</span>
                                                        <span class="tabular-nums font-semibold">${formatIDR(tax + service)}</span>
                                                    </div>
                                                    <div class="flex justify-between font-extrabold text-sm text-[#20231F] pt-2 border-t border-dashed border-stone-200">
                                                        <span>Total Tagihan:</span>
                                                        <span class="tabular-nums text-[#315C46]">${formatIDR(total)}</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <button onclick="openCashierPaymentModal('${tbl.no}', ${total})" class="w-full py-2.5 rounded-xl bg-[#315C46] text-white font-bold text-xs hover:bg-[#264937] transition shadow-xs">
                                                Proses Pembayaran & Tutup Meja
                                            </button>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Right Col: Quick POS / Summary -->
                        <div class="space-y-4">
                            <div class="bg-white rounded-2xl p-5 border border-stone-200 shadow-xs space-y-4">
                                <h3 class="font-extrabold text-sm text-[#20231F]">Ringkasan Kasir Hari Ini</h3>
                                <div class="space-y-3 text-xs">
                                    <div class="flex justify-between p-3 bg-stone-50 rounded-xl">
                                        <span class="text-stone-500">Total Transaksi Selesai</span>
                                        <span class="font-extrabold text-[#20231F]">18 Transaksi</span>
                                    </div>
                                    <div class="flex justify-between p-3 bg-stone-50 rounded-xl">
                                        <span class="text-stone-500">Pendapatan Tunai</span>
                                        <span class="font-extrabold text-[#315C46] tabular-nums">Rp 1.450.000</span>
                                    </div>
                                    <div class="flex justify-between p-3 bg-stone-50 rounded-xl">
                                        <span class="text-stone-500">Pendapatan QRIS / Non-Tunai</span>
                                        <span class="font-extrabold text-[#315C46] tabular-nums">Rp 3.820.000</span>
                                    </div>
                                    <div class="flex justify-between p-3 bg-emerald-50 rounded-xl border border-emerald-200">
                                        <span class="font-bold text-emerald-900">Total Omset Shift</span>
                                        <span class="font-extrabold text-emerald-900 tabular-nums">Rp 5.270.000</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function openCashierPaymentModal(tableNo, totalAmount) {
            renderModal(`
                <div class="bg-white rounded-3xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-stone-200">
                    <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                        <h3 class="font-extrabold text-base text-[#20231F]">Pembayaran Kasir • Meja ${tableNo}</h3>
                        <button onclick="closeModal()" class="w-7 h-7 rounded-full bg-stone-100 flex items-center justify-center hover:bg-stone-200">
                            <i data-lucide="x" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <div class="flex justify-between font-bold text-sm bg-stone-50 p-3 rounded-xl">
                            <span>Total yang Harus Dibayar:</span>
                            <span class="text-[#315C46] tabular-nums">${formatIDR(totalAmount)}</span>
                        </div>
                        <div class="space-y-2">
                            <label class="font-bold text-stone-700">Metode Pembayaran</label>
                            <div class="grid grid-cols-3 gap-2">
                                <button class="py-2.5 rounded-xl border border-[#315C46] bg-[#315C46]/10 text-[#315C46] font-bold text-xs">Tunai (Cash)</button>
                                <button class="py-2.5 rounded-xl border border-stone-200 text-stone-700 font-bold text-xs">QRIS</button>
                                <button class="py-2.5 rounded-xl border border-stone-200 text-stone-700 font-bold text-xs">Kartu EDV</button>
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="font-bold text-stone-700">Uang Diterima (Cash)</label>
                            <input type="number" id="cash-given" value="${totalAmount}" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-xs font-bold tabular-nums">
                        </div>
                    </div>
                    <div class="pt-2">
                        <button onclick="completeCashierPayment('${tableNo}')" class="w-full py-3.5 rounded-xl bg-[#315C46] text-white font-bold text-xs hover:bg-[#264937] transition shadow-md">
                            Konfirmasi Lunas & Cetak Struk
                        </button>
                    </div>
                </div>
            `);
        }

        function completeCashierPayment(tableNo) {
            const tbl = appState.tables.find(t => t.no === tableNo);
            if (tbl) {
                tbl.status = 'empty';
                tbl.session = null;
            }
            closeModal();
            showToast(`Pembayaran Meja ${tableNo} berhasil diselesaikan. Struk tercetak.`, 'success');
            renderApp();
        }


        // ==========================================
        // 5. ADMIN & REPORTING DASHBOARD
        // ==========================================
        function renderAdminApp() {
            return `
                <div class="flex-1 flex flex-col bg-[#F8F6F0]">
                    <!-- Admin Navbar -->
                    <header class="bg-[#20231F] text-white px-6 py-4 flex items-center justify-between border-b border-[#333732] shadow-sm">
                        <div class="flex items-center gap-3">
                            <div class="w-9 h-9 rounded-xl bg-[#315C46] flex items-center justify-center font-bold text-white">⚙️</div>
                            <div>
                                <h1 class="font-extrabold text-sm">Heci.Tech Admin & Management • Kala Resto</h1>
                                <p class="text-xs text-stone-400">Manajemen menu, stok, QR meja, dan laporan analitik</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-3 py-1 bg-[#315C46] text-white rounded-lg text-xs font-bold">Role: Administrator</span>
                        </div>
                    </header>

                    <div class="p-6 max-w-7xl mx-auto w-full space-y-6">
                        <!-- Metrics Overview Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                            <div class="bg-white rounded-2xl p-4 border border-stone-200 shadow-xs space-y-1">
                                <span class="text-xs text-stone-500 font-medium">Penjualan Hari Ini</span>
                                <h3 class="font-extrabold text-xl text-[#20231F] tabular-nums">Rp 5.270.000</h3>
                                <p class="text-[11px] text-emerald-600 font-semibold">↑ +14% dari kemarin</p>
                            </div>
                            <div class="bg-white rounded-2xl p-4 border border-stone-200 shadow-xs space-y-1">
                                <span class="text-xs text-stone-500 font-medium">Total Pesanan</span>
                                <h3 class="font-extrabold text-xl text-[#20231F] tabular-nums">48 Pesanan</h3>
                                <p class="text-[11px] text-stone-400">Rata-rata 3.2 item/order</p>
                            </div>
                            <div class="bg-white rounded-2xl p-4 border border-stone-200 shadow-xs space-y-1">
                                <span class="text-xs text-stone-500 font-medium">Meja Aktif Sesi</span>
                                <h3 class="font-extrabold text-xl text-[#20231F] tabular-nums">2 / 6 Meja</h3>
                                <p class="text-[11px] text-[#315C46] font-semibold">Kapasitas terisi 33%</p>
                            </div>
                            <div class="bg-white rounded-2xl p-4 border border-stone-200 shadow-xs space-y-1">
                                <span class="text-xs text-stone-500 font-medium">Waktu Rata-rata Masak</span>
                                <h3 class="font-extrabold text-xl text-[#20231F] tabular-nums">11.4 Menit</h3>
                                <p class="text-[11px] text-emerald-600 font-semibold">Sangat optimal</p>
                            </div>
                        </div>

                        <!-- Menu Management Table / Section -->
                        <div class="bg-white rounded-2xl p-6 border border-stone-200 shadow-xs space-y-4">
                            <div class="flex items-center justify-between">
                                <h3 class="font-extrabold text-base text-[#20231F]">Manajemen Menu & Ketersediaan Stok</h3>
                                <button onclick="showToast('Fitur tambah menu baru dibuka', 'info')" class="px-4 py-2 rounded-xl bg-[#315C46] text-white font-bold text-xs hover:bg-[#264937] transition shadow-xs flex items-center gap-1.5">
                                    <i data-lucide="plus" class="w-4 h-4"></i> Tambah Menu Baru
                                </button>
                            </div>

                            <div class="overflow-x-auto">
                                <table class="w-full text-left text-xs">
                                    <thead class="bg-stone-50 border-b border-stone-200 text-stone-500">
                                        <tr>
                                            <th class="p-3 font-bold">Menu</th>
                                            <th class="p-3 font-bold">Kategori</th>
                                            <th class="p-3 font-bold">Harga</th>
                                            <th class="p-3 font-bold">Station</th>
                                            <th class="p-3 font-bold">Status Stok</th>
                                            <th class="p-3 font-bold text-right">Aksi</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-stone-100">
                                        ${appState.products.map(prod => `
                                            <tr class="hover:bg-stone-50/50">
                                                <td class="p-3 flex items-center gap-3">
                                                    <img src="${prod.image}" alt="${prod.name}" class="w-10 h-10 rounded-lg object-cover bg-stone-100">
                                                    <div>
                                                        <span class="font-bold text-[#20231F]">${prod.name}</span>
                                                        ${prod.isBestSeller ? '<span class="ml-2 text-[9px] bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">Best Seller</span>' : ''}
                                                    </div>
                                                </td>
                                                <td class="p-3 text-stone-600 capitalize">${prod.categoryId}</td>
                                                <td class="p-3 font-extrabold text-[#315C46] tabular-nums">${formatIDR(prod.price)}</td>
                                                <td class="p-3 uppercase font-semibold text-stone-500">${prod.station}</td>
                                                <td class="p-3">
                                                    <span class="px-2.5 py-1 rounded-full font-bold text-[10px] ${prod.isAvailable ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
                                                        ${prod.isAvailable ? 'Tersedia' : 'Habis (Sold Out)'}
                                                    </span>
                                                </td>
                                                <td class="p-3 text-right">
                                                    <button onclick="toggleProductAvailability('${prod.id}')" class="px-3 py-1 rounded-lg border border-stone-300 font-semibold text-stone-700 hover:bg-stone-100 transition">
                                                        ${prod.isAvailable ? 'Tandai Habis' : 'Tandai Tersedia'}
                                                    </button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function toggleProductAvailability(productId) {
            const prod = appState.products.find(p => p.id === productId);
            if (prod) {
                prod.isAvailable = !prod.isAvailable;
                showToast(`Status ketersediaan ${prod.name} diperbarui.`, 'success');
                renderApp();
            }
        }


        // --- GLOBAL MODAL CONTROLLER ---
        function renderModal(htmlContent) {
            const container = document.getElementById('modal-container');
            container.innerHTML = htmlContent;
            container.classList.remove('hidden');
            lucide.createIcons();
        }

        function closeModal() {
            const container = document.getElementById('modal-container');
            container.classList.add('hidden');
            container.innerHTML = '';
        }

        // Initialize App on load
        window.onload = function() {
            renderApp();
        };
    </script>
</body>
</html>
