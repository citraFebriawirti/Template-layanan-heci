<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-emerald-500 selection:text-white">

    <div id="app" class="min-h-screen flex flex-col">
        <!-- Rendered via JavaScript -->
    </div>

    <script>
        // --- UTILITIES & FORMATTING ---
        const formatIDR = (num) => {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0,
                maximumFractionDigits: 0
            }).format(num).replace('IDR', 'Rp');
        };

        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return dateStr;
            return new Intl.DateTimeFormat('id-ID', {
                day: 'numeric',
                month: 'short',
                year: 'numeric'
            }).format(d);
        };

        const getDaysUntil = (dateStr) => {
            const target = new Date(dateStr);
            const today = new Date();
            today.setHours(0,0,0,0);
            target.setHours(0,0,0,0);
            const diffTime = target - today;
            return Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        };

        // --- INITIAL STATE ---
        let state = {
            currentTab: 'dashboard',
            currentUser: { name: 'Budi Santoso', role: 'Owner', email: 'budi@aruskas.id' },
            sidebarOpen: false,
            toast: null,
            business: {
                name: "Kopi Kenangan Senja & Roti Bakar",
                type: "Kuliner & F&B",
                owner: "Budi Santoso",
                currency: "IDR",
                timezone: "Asia/Jakarta",
                createdAt: "2026-01-01"
            },
            accounts: [
                { id: 'acc-1', name: 'Kas Tunai Toko', type: 'Kas Tunai', initialBalance: 1500000, initialDate: '2026-03-01', balance: 1850000, status: 'Aktif' },
                { id: 'acc-2', name: 'BCA Utama', type: 'Rekening Bank', initialBalance: 12500000, initialDate: '2026-03-01', balance: 14250000, status: 'Aktif' },
                { id: 'acc-3', name: 'GoPay / QRIS Merchant', type: 'E-Wallet', initialBalance: 750000, initialDate: '2026-03-01', balance: 1220000, status: 'Aktif' }
            ],
            categories: [
                { id: 'cat-1', name: 'Penjualan / Omzet', type: 'Pemasukan', desc: 'Pendapatan harian dari penjualan produk', active: true, monthlyBudget: 0 },
                { id: 'cat-2', name: 'Pendapatan Jasa', type: 'Pemasukan', desc: 'Jasa catering atau layanan tambahan', active: true, monthlyBudget: 0 },
                { id: 'cat-3', name: 'Pendapatan Lain-lain', type: 'Pemasukan', desc: 'Sponsorship atau hibah', active: true, monthlyBudget: 0 },
                { id: 'cat-4', name: 'Pembelian Bahan Baku', type: 'Pengeluaran', desc: 'Kopi, susu, roti, kemasan', active: true, monthlyBudget: 6000000 },
                { id: 'cat-5', name: 'Gaji Karyawan', type: 'Pengeluaran', desc: 'Upah staf toko', active: true, monthlyBudget: 4500000 },
                { id: 'cat-6', name: 'Sewa Tempat', type: 'Pengeluaran', desc: 'Sewa ruko bulanan', active: true, monthlyBudget: 2000000 },
                { id: 'cat-7', name: 'Listrik, Air & Internet', type: 'Pengeluaran', desc: 'Utilitas operasional', active: true, monthlyBudget: 800000 },
                { id: 'cat-8', name: 'Transportasi & Logistik', type: 'Pengeluaran', desc: 'Bensin & pengiriman barang', active: true, monthlyBudget: 400000 },
                { id: 'cat-9', name: 'Marketing & Promo', type: 'Pengeluaran', desc: 'Iklan medsos & banner', active: true, monthlyBudget: 500000 },
                { id: 'cat-10', name: 'Biaya Administrasi', type: 'Pengeluaran', desc: 'Admin bank & QRIS', active: true, monthlyBudget: 150000 }
            ],
            transactions: [
                { id: 'tx-1', type: 'Pemasukan', date: '2026-03-10', category: 'Penjualan / Omzet', accountId: 'acc-2', amount: 3500000, desc: 'Setoran omzet penjualan minggu ke-1', contact: 'Pelanggan Umum', status: 'Selesai' },
                { id: 'tx-2', type: 'Pengeluaran', date: '2026-03-11', category: 'Pembelian Bahan Baku', accountId: 'acc-2', amount: 1200000, desc: 'Belanja biji kopi arabika & susu UHT supplier', contact: 'CV Sumber Makmur', status: 'Selesai' },
                { id: 'tx-3', type: 'Pengeluaran', date: '2026-03-12', category: 'Listrik, Air & Internet', accountId: 'acc-3', amount: 450000, desc: 'Bayar token listrik bulanan ruko', contact: 'PLN Pascabayar', status: 'Selesai' },
                { id: 'tx-4', type: 'Pemasukan', date: '2026-03-13', category: 'Penjualan / Omzet', accountId: 'acc-1', amount: 850000, desc: 'Penjualan kasir tunai harian', contact: 'Pelanggan Tunai', status: 'Selesai' },
                { id: 'tx-5', type: 'Pengeluaran', date: '2026-03-14', category: 'Marketing & Promo', accountId: 'acc-3', amount: 200000, desc: 'Boost Instagram Ads weekend promo', contact: 'Meta Platforms', status: 'Selesai' }
            ],
            transfers: [
                { id: 'tr-1', date: '2026-03-09', fromAcc: 'acc-1', toAcc: 'acc-2', amount: 1000000, fee: 0, note: 'Pindahan kas tunai ke rekening bank utama' }
            ],
            receivables: [
                { id: 'rcv-1', customer: 'Kantor Kelurahan Melati', refNumber: 'INV-2026-001', date: '2026-03-02', dueDate: '2026-03-25', desc: 'Catering rapat koordinasi 50 porsi', amount: 1500000, paidAmount: 500000, status: 'Dibayar Sebagian', notes: 'Sisa dibayar setelah acara selesai' },
                { id: 'rcv-2', customer: 'PT Berkah Mandiri', refNumber: 'INV-2026-002', date: '2026-02-20', dueDate: '2026-03-05', desc: 'Sponsorship coffee break kantor', amount: 2400000, paidAmount: 0, status: 'Terlambat', notes: 'Sudah dihubungi via WA' }
            ],
            payables: [
                { id: 'pay-1', supplier: 'CV Supplier Kemasan Jaya', refNumber: 'BILL-889', date: '2026-03-01', dueDate: '2026-03-20', desc: 'Pembelian cup sablon & paperbag 2 rim', amount: 1800000, paidAmount: 800000, status: 'Dibayar Sebagian', notes: 'Jatuh tempo minggu depan' },
                { id: 'pay-2', supplier: 'Toko Mesin Kopi Nusantara', refNumber: 'BILL-902', date: '2026-02-15', dueDate: '2026-03-10', desc: 'Cicilan sparepart espresso machine', amount: 3500000, paidAmount: 3500000, status: 'Lunas', notes: 'Lunas dibayar via BCA' }
            ],
            auditLogs: [
                { id: 'log-1', user: 'Budi Santoso (Owner)', time: '2026-03-14 10:30', action: 'Tambah Transaksi', type: 'Pemasukan', detail: 'Omzet Penjualan Tunai Rp850.000' },
                { id: 'log-2', user: 'Siti Aminah (Staff)', time: '2026-03-11 14:15', action: 'Tambah Transaksi', type: 'Pengeluaran', detail: 'Belanja Bahan Baku Rp1.200.000' }
            ],
            txSearch: '',
            txFilterType: 'Semua',
            txFilterCat: 'Semua',
            modal: null, // 'addTx', 'editTx', 'addTransfer', 'confirm'
            modalData: null
        };

        // --- NOTIFICATION HELPER ---
        function showToast(message, type = 'success') {
            state.toast = { message, type };
            render();
            setTimeout(() => {
                if (state.toast && state.toast.message === message) {
                    state.toast = null;
                    render();
                }
            }, 3500);
        }

        function addAudit(action, type, detail) {
            const newLog = {
                id: 'log-' + Date.now(),
                user: `${state.currentUser.name} (${state.currentUser.role})`,
                time: new Date().toISOString().replace('T', ' ').substring(0, 16),
                action,
                type,
                detail
            };
            state.auditLogs.unshift(newLog);
        }

        // --- FINANCIAL METRICS COMPUTATION ---
        function getComputedMetrics() {
            const totalBalance = state.accounts.filter(a => a.status === 'Aktif').reduce((sum, acc) => sum + acc.balance, 0);
            
            const now = new Date();
            const curYear = now.getFullYear();
            const curMonth = now.getMonth();
            let inc = 0;
            let exp = 0;

            state.transactions.forEach(tx => {
                const d = new Date(tx.date);
                if (d.getFullYear() === curYear && d.getMonth() === curMonth) {
                    if (tx.type === 'Pemasukan') inc += Number(tx.amount);
                    if (tx.type === 'Pengeluaran') exp += Number(tx.amount);
                }
            });

            const totalReceivablesUnpaid = state.receivables
                .filter(r => r.status !== 'Lunas')
                .reduce((sum, r) => sum + (r.amount - r.paidAmount), 0);

            const totalPayablesUnpaid = state.payables
                .filter(p => p.status !== 'Lunas')
                .reduce((sum, p) => sum + (p.amount - p.paidAmount), 0);

            return {
                totalBalance,
                incomeThisMonth: inc,
                expenseThisMonth: exp,
                netProfitThisMonth: inc - exp,
                totalReceivablesUnpaid,
                totalPayablesUnpaid
            };
        }

        // --- ACTIONS ---
        function handleSaveTransaction(e) {
            e.preventDefault();
            const form = e.target;
            const id = form.txId.value;
            const type = form.txType.value;
            const date = form.txDate.value;
            const category = form.txCategory.value;
            const accountId = form.txAccount.value;
            const amount = Number(form.txAmount.value);
            const desc = form.txDesc.value;
            const contact = form.txContact.value;

            if (amount <= 0) {
                showToast('Nominal harus lebih besar dari 0', 'error');
                return;
            }

            const targetAccount = state.accounts.find(a => a.id === accountId);
            if (!targetAccount) {
                showToast('Akun kas tidak valid', 'error');
                return;
            }

            if (id) {
                // Edit
                const oldTx = state.transactions.find(t => t.id === id);
                if (oldTx) {
                    // Revert old account balance
                    state.accounts = state.accounts.map(acc => {
                        if (acc.id === oldTx.accountId) {
                            const diff = oldTx.type === 'Pemasukan' ? -oldTx.amount : oldTx.amount;
                            return { ...acc, balance: acc.balance + diff };
                        }
                        return acc;
                    });
                }
                // Apply new account balance
                state.accounts = state.accounts.map(acc => {
                    if (acc.id === accountId) {
                        const diff = type === 'Pemasukan' ? amount : -amount;
                        return { ...acc, balance: acc.balance + diff };
                    }
                    return acc;
                });

                state.transactions = state.transactions.map(t => t.id === id ? { id, type, date, category, accountId, amount, desc, contact, status: 'Selesai' } : t);
                addAudit('Edit Transaksi', type, `${desc} (${formatIDR(amount)})`);
                showToast('Transaksi berhasil diperbarui');
            } else {
                // Add
                const newTx = {
                    id: 'tx-' + Date.now(),
                    type,
                    date,
                    category,
                    accountId,
                    amount,
                    desc,
                    contact,
                    status: 'Selesai'
                };

                state.accounts = state.accounts.map(acc => {
                    if (acc.id === accountId) {
                        const diff = type === 'Pemasukan' ? amount : -amount;
                        return { ...acc, balance: acc.balance + diff };
                    }
                    return acc;
                });

                state.transactions.unshift(newTx);
                addAudit('Tambah Transaksi', type, `${desc} (${formatIDR(amount)})`);
                showToast('Transaksi berhasil dicatat & saldo diperbarui');
            }

            state.modal = null;
            render();
        }

        function handleDeleteTransaction(txId) {
            if (state.currentUser.role !== 'Owner') {
                showToast('Hanya Owner yang dapat menghapus transaksi', 'error');
                return;
            }
            const tx = state.transactions.find(t => t.id === txId);
            if (!tx) return;

            if (confirm(`Hapus transaksi "${tx.desc}" senilai ${formatIDR(tx.amount)}? Saldo akun akan dikembalikan.`)) {
                state.accounts = state.accounts.map(acc => {
                    if (acc.id === tx.accountId) {
                        const diff = tx.type === 'Pemasukan' ? -tx.amount : tx.amount;
                        return { ...acc, balance: acc.balance + diff };
                    }
                    return acc;
                });
                state.transactions = state.transactions.filter(t => t.id !== txId);
                addAudit('Hapus Transaksi', tx.type, `Hapus ${tx.desc} (${formatIDR(tx.amount)})`);
                showToast('Transaksi berhasil dihapus');
                render();
            }
        }

        function handleSaveTransfer(e) {
            e.preventDefault();
            const form = e.target;
            const fromAcc = form.trFrom.value;
            const toAcc = form.trTo.value;
            const amount = Number(form.trAmount.value);
            const fee = Number(form.trFee.value || 0);
            const date = form.trDate.value;
            const note = form.trNote.value;

            if (amount <= 0) {
                showToast('Nominal transfer harus lebih dari 0', 'error');
                return;
            }
            if (fromAcc === toAcc) {
                showToast('Akun sumber dan tujuan tidak boleh sama', 'error');
                return;
            }

            const sourceAcc = state.accounts.find(a => a.id === fromAcc);
            if (!sourceAcc || sourceAcc.balance < (amount + fee)) {
                showToast('Saldo akun sumber tidak mencukupi untuk transfer & biaya', 'error');
                return;
            }

            state.accounts = state.accounts.map(acc => {
                if (acc.id === fromAcc) return { ...acc, balance: acc.balance - amount - fee };
                if (acc.id === toAcc) return { ...acc, balance: acc.balance + amount };
                return acc;
            });

            const newTransfer = {
                id: 'tr-' + Date.now(),
                date,
                fromAcc,
                toAcc,
                amount,
                fee,
                note
            };

            state.transfers.unshift(newTransfer);
            addAudit('Transfer Internal', 'Transfer', `Transfer ${formatIDR(amount)} dari ${sourceAcc.name}`);
            showToast('Transfer internal berhasil dilakukan');
            state.modal = null;
            render();
        }

        function handlePayReceivable(rcvId) {
            const rcv = state.receivables.find(r => r.id === rcvId);
            if (!rcv) return;
            const remaining = rcv.amount - rcv.paidAmount;
            const input = prompt(`Bayar piutang ${rcv.customer}. Sisa tagihan ${formatIDR(remaining)}. Masukkan nominal (Rp):`, remaining);
            if (!input) return;
            const payAmount = Number(input);

            if (payAmount <= 0 || payAmount > remaining) {
                showToast('Nominal pembayaran piutang tidak valid', 'error');
                return;
            }

            const accountId = state.accounts[1]?.id || state.accounts[0]?.id;
            const newPaid = rcv.paidAmount + payAmount;
            const newStatus = newPaid >= rcv.amount ? 'Lunas' : 'Dibayar Sebagian';

            state.receivables = state.receivables.map(r => r.id === rcvId ? { ...r, paidAmount: newPaid, status: newStatus } : r);
            state.accounts = state.accounts.map(acc => acc.id === accountId ? { ...acc, balance: acc.balance + payAmount } : acc);

            state.transactions.unshift({
                id: 'tx-rcv-' + Date.now(),
                type: 'Pemasukan',
                date: new Date().toISOString().substring(0, 10),
                category: 'Penjualan / Omzet',
                accountId,
                amount: payAmount,
                desc: `Pelunasan Piutang (${rcv.refNumber} - ${rcv.customer})`,
                contact: rcv.customer,
                status: 'Selesai'
            });

            addAudit('Terima Piutang', 'Pemasukan', `Terima piutang ${rcv.customer} Rp${payAmount}`);
            showToast('Pembayaran piutang berhasil dicatat & masuk ke kas');
            render();
        }

        function handlePayPayable(payId) {
            const pay = state.payables.find(p => p.id === payId);
            if (!pay) return;
            const remaining = pay.amount - pay.paidAmount;
            const input = prompt(`Bayar utang ${pay.supplier}. Sisa utang ${formatIDR(remaining)}. Masukkan nominal (Rp):`, remaining);
            if (!input) return;
            const payAmount = Number(input);

            if (payAmount <= 0 || payAmount > remaining) {
                showToast('Nominal pembayaran utang tidak valid', 'error');
                return;
            }

            const accountId = state.accounts[1]?.id || state.accounts[0]?.id;
            const sourceAcc = state.accounts.find(a => a.id === accountId);
            if (!sourceAcc || sourceAcc.balance < payAmount) {
                showToast('Saldo akun kas tidak cukup untuk membayar utang', 'error');
                return;
            }

            const newPaid = pay.paidAmount + payAmount;
            const newStatus = newPaid >= pay.amount ? 'Lunas' : 'Dibayar Sebagian';

            state.payables = state.payables.map(p => p.id === payId ? { ...p, paidAmount: newPaid, status: newStatus } : p);
            state.accounts = state.accounts.map(acc => acc.id === accountId ? { ...acc, balance: acc.balance - payAmount } : acc);

            state.transactions.unshift({
                id: 'tx-pay-' + Date.now(),
                type: 'Pengeluaran',
                date: new Date().toISOString().substring(0, 10),
                category: 'Pembelian Bahan Baku',
                accountId,
                amount: payAmount,
                desc: `Pembayaran Utang (${pay.refNumber} - ${pay.supplier})`,
                contact: pay.supplier,
                status: 'Selesai'
            });

            addAudit('Bayar Utang', 'Pengeluaran', `Bayar utang ${pay.supplier} Rp${payAmount}`);
            showToast('Pembayaran utang berhasil dicatat');
            render();
        }

        function sendWhatsAppReminder(rcvId) {
            const rcv = state.receivables.find(r => r.id === rcvId);
            if (!rcv) return;
            const remaining = rcv.amount - rcv.paidAmount;
            const text = `Halo Yth. Bpk/Ibu dari *${rcv.customer}*,\n\nKami dari manajemen *${state.business.name}* ingin mengingatkan perihal tagihan nomor *${rcv.refNumber}* (${rcv.desc}) sebesar *${formatIDR(remaining)}* yang jatuh tempo pada tanggal *${formatDate(rcv.dueDate)}*.\n\nMohon konfirmasi pembayaran ke rekening usaha kami. Terima kasih! 🙏`;
            window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
            showToast('Membuka WhatsApp Web untuk mengirim pengingat');
        }

        // --- RENDER ENGINE ---
        function render() {
            const app = document.getElementById('app');
            const metrics = getComputedMetrics();

            app.innerHTML = `
                <!-- Toast Notification -->
                ${state.toast ? `
                    <div class="fixed top-5 right-5 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl text-white transition-all transform animate-bounce ${state.toast.type === 'error' ? 'bg-red-500' : 'bg-emerald-600'}">
                        <i data-lucide="${state.toast.type === 'error' ? 'alert-triangle' : 'check-circle-2'}" class="w-5 h-5"></i>
                        <span class="text-sm font-semibold">${state.toast.message}</span>
                    </div>
                ` : ''}

                <!-- Main Layout -->
                <div class="flex flex-1 overflow-hidden">
                    <!-- SIDEBAR -->
                    <aside class="fixed inset-y-0 left-0 z-40 w-64 bg-white border-r border-slate-200 text-slate-800 flex flex-col transform transition-transform duration-300 ease-in-out lg:translate-x-0 ${state.sidebarOpen ? 'translate-x-0' : '-translate-x-full'} shadow-xl lg:shadow-none">
                        <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center shadow-md text-white font-bold text-xl">
                                    🧮
                                </div>
                                <div>
                                    <h1 class="font-bold text-lg tracking-tight text-slate-900 flex items-center gap-1.5">
                                        ArusKas <span class="text-[10px] bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full font-bold">PRO</span>
                                    </h1>
                                    <p class="text-xs text-slate-500 font-medium">SaaS Keuangan UMKM</p>
                                </div>
                            </div>
                            <button onclick="state.sidebarOpen = false; render();" class="lg:hidden text-slate-500 hover:text-slate-800">
                                <i data-lucide="x" class="w-6 h-6"></i>
                            </button>
                        </div>

                        <div class="px-4 py-3 mx-4 my-3 bg-slate-50 rounded-xl border border-slate-200 flex items-center gap-3">
                            <i data-lucide="building-2" class="w-5 h-5 text-emerald-600"></i>
                            <div class="overflow-hidden">
                                <p class="text-xs font-semibold text-slate-900 truncate">${state.business.name}</p>
                                <p class="text-[10px] text-slate-500 truncate">${state.business.type} • IDR</p>
                            </div>
                        </div>

                        <nav class="flex-1 px-3 py-2 space-y-1 overflow-y-auto">
                            ${[
                                { id: 'dashboard', label: 'Ringkasan', icon: 'layout-dashboard' },
                                { id: 'transactions', label: 'Transaksi', icon: 'receipt' },
                                { id: 'accounts', label: 'Akun Kas', icon: 'wallet' },
                                { id: 'categories', label: 'Kategori', icon: 'layers' },
                                { id: 'transfers', label: 'Transfer Saldo', icon: 'arrow-left-right' },
                                { id: 'receivables', label: 'Piutang', icon: 'hand-coins' },
                                { id: 'payables', label: 'Utang', icon: 'piggy-bank' },
                                { id: 'budgets', label: 'Anggaran', icon: 'bar-chart-3' },
                                { id: 'reports', label: 'Laporan Keuangan', icon: 'file-text' },
                                { id: 'settings', label: 'Pengaturan & Akses', icon: 'settings' }
                            ].map(item => `
                                <button
                                    onclick="state.currentTab = '${item.id}'; state.sidebarOpen = false; render();"
                                    class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${state.currentTab === item.id ? 'bg-emerald-600 text-white shadow-md shadow-emerald-500/20 font-bold' : 'text-slate-600 hover:bg-slate-50 hover:text-slate-900'}"
                                >
                                    <i data-lucide="${item.icon}" class="w-5 h-5 ${state.currentTab === item.id ? 'text-white' : 'text-emerald-600'}"></i>
                                    <span>${item.label}</span>
                                </button>
                            `).join('')}
                        </nav>

                                    <div>
                                        <label class="text-xs font-semibold text-slate-500">Biaya Transfer (Rp)</label>
                                        <input type="number" name="trFee" placeholder="0" value="0" min="0" class="w-full mt-1 px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 text-slate-900 rounded-xl" />
                                    </div>
                                </div>

                                <div>
                                    <label class="text-xs font-semibold text-slate-500">Tanggal</label>
                                    <input type="date" name="trDate" value="${new Date().toISOString().substring(0,10)}" required class="w-full mt-1 px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 text-slate-900 rounded-xl" />
                                </div>

                                <div>
                                    <label class="text-xs font-semibold text-slate-500">Catatan Transfer</label>
                                    <input type="text" name="trNote" placeholder="Contoh: Tarik tunai kas untuk setoran bank" class="w-full mt-1 px-3.5 py-2 text-sm bg-slate-50 border border-slate-200 text-slate-900 rounded-xl" />
                                </div>

                                <div class="flex justify-end gap-3 pt-3">
                                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-slate-500 hover:bg-slate-100 rounded-xl">Batal</button>
                                    <button type="submit" class="px-5 py-2 text-sm font-semibold text-white bg-emerald-600 hover:bg-emerald-700 rounded-xl shadow-md">Proses Transfer</button>
                                </div>
                            </form>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        // Initial mount
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
