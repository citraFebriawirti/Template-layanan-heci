                setCart(prev => {
                    const existingIndex = prev.findIndex(item => item.id === product.id && item.variant === variant);
                    if (existingIndex > -1) {
                        const updated = [...prev];
                        updated[existingIndex].qty += qty;
                        return updated;
                    }
                    return [...prev, { ...product, variant, qty, type: 'merch' }];
                });
                showToast(`Berhasil menambahkan "${product.name}" (${variant}) ke keranjang.`);
            };

            const removeFromCart = (index) => {
                setCart(prev => prev.filter((_, i) => i !== index));
            };

            const updateCartQty = (index, delta) => {
                setCart(prev => {
                    const updated = [...prev];
                    const newQty = updated[index].qty + delta;
                    if (newQty <= 0) {
                        return prev.filter((_, i) => i !== index);
                    }
                    updated[index].qty = newQty;
                    return updated;
                });
            };

                                                <td className="p-4 font-bold text-terracotta">Rp {pr.collected.toLocaleString('id-ID')}</td>
                                                <td className="p-4"><span className="px-2.5 py-1 bg-forest/10 text-forest rounded-full font-semibold">{pr.status}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === 'orders' && (
                        <div className="bg-white rounded-3xl border border-stone p-8 shadow-sm space-y-6">
                            <h3 className="font-editorial text-xl font-bold text-forest">Manajemen Pesanan & Pengiriman</h3>
                            <div className="overflow-x-auto">
                                <table className="w-full text-left text-xs">
                                    <thead className="bg-ivory border-b border-stone text-charcoal uppercase tracking-wider font-semibold">
                                        <tr>
                                            <th className="p-4">ID Transaksi</th>
                                            <th className="p-4">Pemesan</th>
                                            <th className="p-4">Total</th>
                                            <th className="p-4">Pembayaran</th>
                                            <th className="p-4">Pengiriman</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-stone">
                                        {orders.map(o => (
                                            <tr key={o.id}>
                                                <td className="p-4 font-bold text-forest">{o.id}</td>
                                                <td className="p-4">{o.customerName}</td>
                                                <td className="p-4">Rp {o.total.toLocaleString('id-ID')}</td>
                                                <td className="p-4"><span className="px-2 py-1 bg-forest/10 text-forest rounded-full font-semibold">{o.paymentStatus}</span></td>
                                                <td className="p-4"><span className="px-2 py-1 bg-terracotta/10 text-terracotta rounded-full font-semibold">{o.fulfillmentStatus}</span></td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}

                    {activeTab === 'reports' && (
                        <div className="bg-white rounded-3xl border border-stone p-8 shadow-sm space-y-6">
                            <h3 className="font-editorial text-xl font-bold text-forest">Laporan Keuangan Gabungan & Terpisah</h3>
                            <p className="text-xs text-charcoal-light">
                                Laporan ini memisahkan omzet penjualan merchandise dari donasi sukarela program sesuai standar akuntansi nirlaba.
                            </p>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 pt-4">
                                <div className="p-6 bg-ivory rounded-2xl border border-stone space-y-2">
                                    <span className="text-xs font-bold text-forest uppercase">Omzet Merchandise</span>
                                    <span className="font-editorial text-3xl font-bold text-charcoal block">Rp {totalMerchSales.toLocaleString('id-ID')}</span>
                                    <span className="text-[11px] text-charcoal-light">Termasuk PPN & Biaya Logistik</span>
                                </div>
                                <div className="p-6 bg-ivory rounded-2xl border border-stone space-y-2">
                                    <span className="text-xs font-bold text-terracotta uppercase">Dana Program Donasi</span>
                                    <span className="font-editorial text-3xl font-bold text-terracotta block">Rp {totalDonations.toLocaleString('id-ID')}</span>
                                    <span className="text-[11px] text-charcoal-light">Disalurkan 100% tanpa potongan operasional merch</span>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        // --- RENDER REACT APP ---
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
