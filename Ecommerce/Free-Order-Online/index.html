        function navigateTo(view, orderId = null) {
            state.currentView = view;
            if (orderId) state.activeTrackingOrderId = orderId;
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function render() {
            const appEl = document.getElementById('app');
            appEl.innerHTML = '';

            if (state.currentView.startsWith('customer-')) {
                appEl.innerHTML += renderCustomerHeader();
            } else if (state.currentView.startsWith('ops-') && state.currentView !== 'ops-login') {
                appEl.innerHTML += renderOpsNavbar();
            }

            // Route views
            switch (state.currentView) {
                case 'customer-home':
                    appEl.innerHTML += renderCustomerHome();
                    break;
                case 'customer-catalog':
                    appEl.innerHTML += renderCustomerCatalog();
                    break;
                case 'customer-checkout':
                    appEl.innerHTML += renderCustomerCheckout();
                    break;
                case 'customer-tracking':
                    appEl.innerHTML += renderCustomerTracking();
                    break;
                case 'ops-login':
                    appEl.innerHTML += renderOpsLogin();
                    break;
                case 'ops-cashier':
                    appEl.innerHTML += renderOpsCashier();
                    break;
                case 'ops-kitchen':
                    appEl.innerHTML += renderOpsKitchen();
                    break;
                case 'ops-admin':
                    appEl.innerHTML += renderOpsAdmin();
                    break;
                default:
                    appEl.innerHTML += renderCustomerHome();
            }

            appEl.innerHTML += renderFooter();
            
            // Render modal if active
            if (state.activeModalProduct) {
                appEl.innerHTML += renderProductModal();
            }
        }

                                <div class="absolute inset-0 bg-gradient-to-t from-deepCharcoal/70 via-transparent to-transparent flex flex-col justify-end p-6 text-white">
                                    <span class="bg-chiliOrange text-white text-xs font-bold px-3 py-1 rounded-full w-max mb-2">Signature Dish</span>
                                    <h3 class="font-extrabold text-2xl">Nasi Rendang Sapi Wagyu</h3>
                                    <p class="text-xs text-stone-200 mt-1">Dimasak 8 jam dengan rempah pilihan terbaik</p>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Categories Quick Grid -->
                    <section class="bg-softSand/50 py-12 px-4 lg:px-16 border-y border-softSand">
                        <div class="max-w-7xl mx-auto">
                            <div class="flex justify-between items-end mb-8">
                                <div>
                                    <h2 class="text-2xl font-extrabold text-deepCharcoal">Kategori Pilihan</h2>
                                    <p class="text-sm text-stone-500 mt-1">Eksplorasi ragam menu spesial kami</p>
                                </div>
                                <button onclick="navigateTo('customer-catalog')" class="text-sm font-bold text-chiliOrange hover:underline">Lihat Semua Menu →</button>
                            </div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-4">
                                ${DEFAULT_CATEGORIES.filter(c => c.slug !== 'all').map(cat => `
                                    <div onclick="state.selectedCategory='${cat.id}'; navigateTo('customer-catalog');" class="bg-white p-6 rounded-2xl border border-softSand hover:border-chiliOrange cursor-pointer transition text-center group shadow-sm">
                                        <div class="w-12 h-12 bg-chiliOrange/10 text-chiliOrange rounded-xl flex items-center justify-center mx-auto mb-3 font-bold text-lg group-hover:bg-chiliOrange group-hover:text-white transition">
                                            ${cat.name.charAt(0)}
                                        </div>
                                        <h3 class="font-bold text-sm text-deepCharcoal group-hover:text-chiliOrange transition">${cat.name}</h3>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    </section>

                    <!-- Popular Best Sellers -->
                    <section class="py-16 px-4 lg:px-16 max-w-7xl mx-auto">
                        <div class="flex justify-between items-end mb-8">
                            <div>
                                <h2 class="text-2xl font-extrabold text-deepCharcoal">Menu Terfavorit</h2>
                                <p class="text-sm text-stone-500 mt-1">Pilihan paling sering dipesan oleh pelanggan setia kami</p>
                            </div>
                            <button onclick="navigateTo('customer-catalog')" class="text-sm font-bold text-chiliOrange hover:underline">Lihat Menu Lainnya →</button>
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                            ${popularProducts.map(product => renderProductCard(product)).join('')}
                        </div>
                    </section>
                </main>
            `;
        }

        /* ==========================================================================
           6. MENU CATALOG & PRODUCT CARD
           ========================================================================== */
        function renderCustomerCatalog() {
            const filteredProducts = DEFAULT_PRODUCTS.filter(p => {
                const matchCat = state.selectedCategory === 'all' || p.categoryId === state.selectedCategory;
                const matchQuery = p.name.toLowerCase().includes(state.searchQuery.toLowerCase()) || p.description.toLowerCase().includes(state.searchQuery.toLowerCase());
                return matchCat && matchQuery;
            });

            return `
                <main class="flex-grow max-w-7xl mx-auto px-4 lg:px-16 py-8 w-full">
                    <!-- Search & Title Bar -->
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
                        <div>
                            <h1 class="text-3xl font-extrabold text-deepCharcoal">Katalog Menu</h1>
                            <p class="text-sm text-stone-500 mt-1">Ketersediaan disesuaikan dengan outlet: <span class="font-semibold text-deepCharcoal">${state.selectedOutlet.name}</span></p>
                        </div>
                        <div class="w-full md:w-80">
                            <div class="relative">
                                <input type="text" id="searchInput" oninput="handleSearchInput(this.value)" value="${state.searchQuery}" placeholder="Cari makanan atau minuman..." class="w-full bg-white border border-softSand rounded-xl px-4 py-3 pl-10 text-sm focus:outline-none focus:border-chiliOrange transition">
                                <svg class="w-5 h-5 text-stone-400 absolute left-3 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Category Pills -->
                    <div class="flex items-center gap-2 overflow-x-auto pb-4 mb-8 scrollbar-none">
                        ${DEFAULT_CATEGORIES.map(cat => `
                            <button onclick="state.selectedCategory='${cat.id}'; render();" class="px-5 py-2.5 rounded-xl text-sm font-semibold whitespace-nowrap transition ${state.selectedCategory === cat.id ? 'bg-chiliOrange text-white shadow-md shadow-chiliOrange/20' : 'bg-white text-stone-600 border border-softSand hover:border-chiliOrange'}">
                                ${cat.name}
                            </button>
                        `).join('')}
                    </div>

                    <!-- Product Grid -->
                    ${filteredProducts.length === 0 ? `
                        <div class="py-20 text-center bg-white rounded-3xl border border-softSand my-6">
                            <div class="w-16 h-16 bg-stone-100 rounded-full flex items-center justify-center mx-auto mb-4 text-stone-400 text-2xl">🍽️</div>
                            <h3 class="font-bold text-lg text-deepCharcoal">Menu Tidak Ditemukan</h3>
                            <p class="text-sm text-stone-500 mt-1">Coba gunakan kata kunci lain atau pilih kategori berbeda.</p>
                        </div>
                    ` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                            ${filteredProducts.map(p => renderProductCard(p)).join('')}
                        </div>
                    `}
                </main>
            `;
        }

        function renderProductCard(product) {
            const isAvailable = state.inventoryStock[product.id] !== false;
            return `
                <div class="bg-white rounded-2xl border border-softSand overflow-hidden shadow-sm hover:shadow-md transition flex flex-col group">
                    <div class="relative aspect-[4/3] overflow-hidden bg-stone-100">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" onerror="this.src='https://placehold.co/600x400/EEE5DA/25231F?text=Sajian+Nusantara'">
                        <div class="absolute top-3 left-3 flex flex-wrap gap-1.5">
                            ${product.isBestSeller ? `<span class="bg-chiliOrange text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow">Best Seller</span>` : ''}
                            ${product.isNew ? `<span class="bg-sageGreen text-white text-xs font-bold px-2.5 py-1 rounded-lg shadow">Baru</span>` : ''}
                        </div>
                        ${!isAvailable ? `<div class="absolute inset-0 bg-deepCharcoal/60 backdrop-blur-[2px] flex items-center justify-center text-white font-bold text-sm tracking-wider">HABIS TERJUAL</div>` : ''}
                    </div>
                    <div class="p-5 flex flex-col flex-grow">
                        <h3 class="font-extrabold text-base text-deepCharcoal group-hover:text-chiliOrange transition">${product.name}</h3>
                        <p class="text-xs text-stone-500 mt-1.5 line-clamp-2 leading-relaxed flex-grow">${product.description}</p>
                        
                        <div class="flex items-center justify-between mt-5 pt-4 border-t border-softSand">
                            <div>
                                <span class="text-xs text-stone-400 block font-medium">Harga</span>
                                <span class="font-extrabold text-deepCharcoal text-base">Rp ${product.price.toLocaleString('id-ID')}</span>
                            </div>
                            <button ${!isAvailable ? 'disabled' : `onclick="openProductModal('${product.id}')"`} class="px-4 py-2.5 rounded-xl text-sm font-bold transition ${isAvailable ? 'bg-deepCharcoal text-warmIvory hover:bg-chiliOrange' : 'bg-stone-200 text-stone-400 cursor-not-allowed'}">
                                ${isAvailable ? 'Pilih Menu' : 'Habis'}
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           7. PRODUCT CUSTOMIZATION MODAL
           ========================================================================== */
        function openProductModal(productId) {
            const product = DEFAULT_PRODUCTS.find(p => p.id === productId);
            if (!product) return;
            state.activeModalProduct = {
                ...product,
                selectedVariant: product.variants[0] || null,
                selectedAddons: [],
                quantity: 1,
                notes: ''
            };
            render();
        }

        function closeModal() {
            state.activeModalProduct = null;
            render();
        }

        function renderProductModal() {
            const p = state.activeModalProduct;
            if (!p) return '';
            
            let calculatedPrice = p.price;
            if (p.selectedVariant) calculatedPrice += p.selectedVariant.priceOffset;
            p.selectedAddons.forEach(addon => calculatedPrice += addon.price);
            calculatedPrice *= p.quantity;

            return `
                <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-deepCharcoal/60 backdrop-blur-sm fade-in">
                    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-softSand max-h-[90vh] flex flex-col">
                        <div class="relative h-56 bg-stone-100 flex-shrink-0">
                            <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
                            <button onclick="closeModal()" class="absolute top-4 right-4 bg-white/80 hover:bg-white text-deepCharcoal w-9 h-9 rounded-full flex items-center justify-center font-bold shadow transition">✕</button>
                        </div>
                        <div class="p-6 overflow-y-auto space-y-6 flex-grow">
                            <div>
                                <h2 class="text-2xl font-extrabold text-deepCharcoal">${p.name}</h2>
                                <p class="text-sm text-stone-500 mt-1">${p.description}</p>
                                <p class="font-extrabold text-chiliOrange text-lg mt-3">Rp ${p.price.toLocaleString('id-ID')}</p>
                            </div>

                            ${p.variants && p.variants.length > 0 ? `
                                <div>
                                    <h3 class="font-bold text-sm text-deepCharcoal mb-3 flex items-center justify-between">
                                        <span>Pilihan Varian <span class="text-chiliOrange">*</span></span>
                                        <span class="text-xs text-stone-400 font-normal">Pilih salah satu</span>
                                    </h3>
                                    <div class="space-y-2">
                                        ${p.variants.map((v, i) => `
                                            <label class="flex items-center justify-between p-3.5 rounded-xl border border-softSand hover:border-chiliOrange cursor-pointer transition ${p.selectedVariant?.name === v.name ? 'bg-chiliOrange/5 border-chiliOrange' : 'bg-white'}">
                                                <div class="flex items-center gap-3">
                                                    <input type="radio" name="variantRadio" ${p.selectedVariant?.name === v.name ? 'checked' : ''} onchange="setProductVariant(${i})" class="text-chiliOrange focus:ring-chiliOrange">
                                                    <span class="text-sm font-semibold text-deepCharcoal">${v.name}</span>
                                                </div>
                                                <span class="text-xs font-bold text-stone-500">${v.priceOffset > 0 ? `+Rp ${v.priceOffset.toLocaleString('id-ID')}` : 'Termasuk'}</span>
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            ${p.addons && p.addons.length > 0 ? `
                                <div>
                                    <h3 class="font-bold text-sm text-deepCharcoal mb-3">Add-ons Tambahan (Opsional)</h3>
                                    <div class="space-y-2">
                                        ${p.addons.map((addon, i) => {
                                            const isChecked = p.selectedAddons.some(a => a.name === addon.name);
                                            return `
                                                <label class="flex items-center justify-between p-3.5 rounded-xl border border-softSand hover:border-chiliOrange cursor-pointer transition ${isChecked ? 'bg-chiliOrange/5 border-chiliOrange' : 'bg-white'}">
                                                    <div class="flex items-center gap-3">
                                                        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleProductAddon(${i})" class="rounded text-chiliOrange focus:ring-chiliOrange">
                                                        <span class="text-sm font-semibold text-deepCharcoal">${addon.name}</span>
                                                    </div>
                                                    <span class="text-xs font-bold text-stone-500">+Rp ${addon.price.toLocaleString('id-ID')}</span>
                                                </label>
                                            `;
                                        }).join('')}
                                    </div>
                                </div>
                            ` : ''}

                            <div>
                                <h3 class="font-bold text-sm text-deepCharcoal mb-2">Catatan Khusus untuk Dapur</h3>
                                <textarea id="productNotes" oninput="state.activeModalProduct.notes = this.value" placeholder="Contoh: Jangan pakai pedas, kuah dipisah..." class="w-full bg-softSand/40 border border-softSand rounded-xl p-3 text-sm focus:outline-none focus:border-chiliOrange">${p.notes}</textarea>
                            </div>
                        </div>

                        <!-- Modal Footer / CTA -->
                        <div class="p-6 bg-white border-t border-softSand flex items-center justify-between gap-4 flex-shrink-0">
                            <div class="flex items-center gap-3 bg-softSand/50 p-1.5 rounded-xl border border-softSand">
                                <button onclick="adjustModalQty(-1)" class="w-8 h-8 rounded-lg bg-white font-bold text-deepCharcoal shadow-sm hover:bg-stone-100 transition">-</button>
                                <span class="font-bold text-deepCharcoal w-6 text-center">${p.quantity}</span>
                                <button onclick="adjustModalQty(1)" class="w-8 h-8 rounded-lg bg-white font-bold text-deepCharcoal shadow-sm hover:bg-stone-100 transition">+</button>
                            </div>
                            <button onclick="addProductToCart()" class="flex-grow bg-chiliOrange hover:bg-chiliOrangeHover text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-chiliOrange/20 transition flex items-center justify-between">
                                <span>Masukkan Keranjang</span>
                                <span>Rp ${calculatedPrice.toLocaleString('id-ID')}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function setProductVariant(index) {
            state.activeModalProduct.selectedVariant = state.activeModalProduct.variants[index];
            render();
        }

        function toggleProductAddon(index) {
            const addon = state.activeModalProduct.addons[index];
            const exists = state.activeModalProduct.selectedAddons.some(a => a.name === addon.name);
            if (exists) {
                state.activeModalProduct.selectedAddons = state.activeModalProduct.selectedAddons.filter(a => a.name !== addon.name);
            } else {
                state.activeModalProduct.selectedAddons.push(addon);
            }
            render();
        }

        function adjustModalQty(amount) {
            state.activeModalProduct.quantity = Math.max(1, state.activeModalProduct.quantity + amount);
            render();
        }

        function addProductToCart() {
            const p = state.activeModalProduct;
            let unitPrice = p.price;
            if (p.selectedVariant) unitPrice += p.selectedVariant.priceOffset;
            p.selectedAddons.forEach(addon => unitPrice += addon.price);

            const cartItem = {
                cartId: 'item-' + Date.now() + Math.random().toString(36).substr(2, 4),
                productId: p.id,
                name: p.name,
                image: p.image,
                variant: p.selectedVariant ? p.selectedVariant.name : null,
                addons: p.selectedAddons.map(a => a.name),
                notes: p.notes,
                unitPrice: unitPrice,
                quantity: p.quantity,
                totalPrice: unitPrice * p.quantity
            };

            state.cart.push(cartItem);
            closeModal();
            toggleCartDrawer(true);
        }

        /* ==========================================================================
           8. SHOPPING CART DRAWER
           ========================================================================== */
        let isCartOpen = false;

        function toggleCartDrawer(open = null) {
            isCartOpen = open !== null ? open : !isCartOpen;
            const existingDrawer = document.getElementById('cartDrawer');
            if (existingDrawer) existingDrawer.remove();

            if (isCartOpen) {
                document.body.insertAdjacentHTML('beforeend', renderCartDrawerHtml());
            }
        }

        function renderCartDrawerHtml() {
            const subtotal = state.cart.reduce((sum, item) => sum + item.totalPrice, 0);
            return `
                <div id="cartDrawer" class="fixed inset-0 z-50 flex justify-end bg-deepCharcoal/50 backdrop-blur-sm fade-in">
                    <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl border-l border-softSand">
                        <div class="p-6 border-b border-softSand flex items-center justify-between">
                            <h2 class="font-extrabold text-xl text-deepCharcoal flex items-center gap-2">
                                🛍️ Keranjang Pesanan
                            </h2>
                            <button onclick="toggleCartDrawer(false)" class="w-8 h-8 rounded-full bg-stone-100 text-deepCharcoal font-bold hover:bg-stone-200 transition">✕</button>
                        </div>

                        <div class="p-4 bg-warmIvory border-b border-softSand flex items-center justify-between text-xs">
                            <span class="font-semibold text-stone-600">Outlet Dipilih:</span>
                            <span class="font-extrabold text-chiliOrange">${state.selectedOutlet.name}</span>
                        </div>

                        <div class="flex-grow overflow-y-auto p-6 space-y-4">
                            ${state.cart.length === 0 ? `
                                <div class="py-20 text-center">
                                    <div class="text-4xl mb-3">🛒</div>
                                    <h3 class="font-bold text-deepCharcoal">Keranjang Masih Kosong</h3>
                                    <p class="text-xs text-stone-500 mt-1">Belum ada hidangan lezat yang dipilih.</p>
                                </div>
                            ` : state.cart.map(item => `
                                <div class="bg-white p-4 rounded-2xl border border-softSand flex gap-4 items-start relative group">
                                    <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-xl object-cover bg-stone-100 flex-shrink-0">
                                    <div class="flex-grow">
                                        <h4 class="font-extrabold text-sm text-deepCharcoal">${item.name}</h4>
                                        ${item.variant ? `<p class="text-xs text-stone-500 font-medium">Varian: ${item.variant}</p>` : ''}
                                        ${item.addons && item.addons.length > 0 ? `<p class="text-xs text-stone-400">Add-ons: ${item.addons.join(', ')}</p>` : ''}
                                        ${item.notes ? `<p class="text-xs text-chiliOrange italic mt-1">Catatan: "${item.notes}"</p>` : ''}
                                        <div class="flex items-center justify-between mt-3">
                                            <span class="font-extrabold text-sm text-deepCharcoal">Rp ${item.totalPrice.toLocaleString('id-ID')}</span>
                                            <div class="flex items-center gap-2 bg-softSand/50 p-1 rounded-lg">
                                                <button onclick="updateCartQty('${item.cartId}', -1)" class="w-6 h-6 bg-white rounded font-bold text-xs shadow-sm">-</button>
                                                <span class="text-xs font-bold w-5 text-center">${item.quantity}</span>
                                                <button onclick="updateCartQty('${item.cartId}', 1)" class="w-6 h-6 bg-white rounded font-bold text-xs shadow-sm">+</button>
                                            </div>
                                        </div>
                                    </div>
                                    <button onclick="removeFromCart('${item.cartId}')" class="absolute top-3 right-3 text-stone-400 hover:text-red-500 text-xs font-bold">✕</button>
                                </div>
                            `).join('')}
                        </div>

                        ${state.cart.length > 0 ? `
                            <div class="p-6 bg-white border-t border-softSand space-y-4 flex-shrink-0">
                                <div class="flex justify-between text-sm">
                                    <span class="text-stone-500 font-medium">Subtotal</span>
                                    <span class="font-extrabold text-deepCharcoal">Rp ${subtotal.toLocaleString('id-ID')}</span>
                                </div>
                                <button onclick="toggleCartDrawer(false); navigateTo('customer-checkout');" class="w-full bg-chiliOrange hover:bg-chiliOrangeHover text-white font-bold py-4 rounded-xl shadow-lg shadow-chiliOrange/20 transition text-center">
                                    Lanjut ke Checkout
                                </button>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function updateCartQty(cartId, delta) {
            const item = state.cart.find(i => i.cartId === cartId);
            if (!item) return;
            item.quantity += delta;
            if (item.quantity <= 0) {
                state.cart = state.cart.filter(i => i.cartId !== cartId);
            } else {
                item.totalPrice = item.unitPrice * item.quantity;
            }
            render();
            if (isCartOpen) toggleCartDrawer(true);
        }

        function removeFromCart(cartId) {
            state.cart = state.cart.filter(i => i.cartId !== cartId);
            render();
            if (isCartOpen) toggleCartDrawer(true);
        }

        /* ==========================================================================
           9. CHECKOUT PAGE
           ========================================================================== */
        function renderCustomerCheckout() {
            if (state.cart.length === 0) {
                return `
                    <main class="flex-grow max-w-4xl mx-auto px-4 py-20 text-center">
                        <h2 class="text-2xl font-extrabold text-deepCharcoal mb-2">Keranjang Kosong</h2>
                        <p class="text-stone-500 mb-6">Silakan pilih menu sebelum melanjutkan ke checkout.</p>
                        <button onclick="navigateTo('customer-catalog')" class="bg-chiliOrange text-white font-bold px-6 py-3 rounded-xl">Lihat Katalog Menu</button>
                    </main>
                `;
            }

            const subtotal = state.cart.reduce((sum, item) => sum + item.totalPrice, 0);
            const deliveryFee = state.checkoutForm.fulfillmentType === 'delivery' ? 15000 : 0;
            
            let discount = 0;
            const v = state.checkoutForm.appliedVoucher;
            if (v) {
                if (subtotal >= v.minSpend) {
                    if (v.discountType === 'percent') {
                        discount = (subtotal * v.discountValue) / 100;
                        if (v.maxDiscount && discount > v.maxDiscount) discount = v.maxDiscount;
                    } else {
                        discount = v.discountValue;
                    }
                }
            }
            const grandTotal = Math.max(0, subtotal + deliveryFee - discount);

            return `
                <main class="flex-grow max-w-7xl mx-auto px-4 lg:px-16 py-8 w-full">
                    <h1 class="text-3xl font-extrabold text-deepCharcoal mb-8">Checkout Pesanan</h1>
                    
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        <!-- Left Form -->
                        <div class="lg:col-span-7 space-y-6">
                            <!-- Fulfillment Type Selection -->
                            <div class="bg-white p-6 rounded-2xl border border-softSand shadow-sm space-y-4">
                                <h2 class="font-extrabold text-base text-deepCharcoal">Metode Pemenuhan Pesanan</h2>
                                <div class="grid grid-cols-2 gap-4">
                                    <button onclick="state.checkoutForm.fulfillmentType='delivery'; render();" class="p-4 rounded-xl border text-left font-bold transition flex items-center gap-3 ${state.checkoutForm.fulfillmentType === 'delivery' ? 'bg-chiliOrange/5 border-chiliOrange text-chiliOrange' : 'border-softSand text-deepCharcoal hover:border-stone-400'}">
                                        <span class="text-xl">🛵</span>
                                        <div>
                                            <div>Delivery</div>
                                            <div class="text-xs font-normal text-stone-500">Diantar ke alamat Anda</div>
                                        </div>
                                    </button>
                                    <button onclick="state.checkoutForm.fulfillmentType='pickup'; render();" class="p-4 rounded-xl border text-left font-bold transition flex items-center gap-3 ${state.checkoutForm.fulfillmentType === 'pickup' ? 'bg-chiliOrange/5 border-chiliOrange text-chiliOrange' : 'border-softSand text-deepCharcoal hover:border-stone-400'}">
                                        <span class="text-xl">🛍️</span>
                                        <div>
                                            <div>Pickup Mandiri</div>
                                            <div class="text-xs font-normal text-stone-500">Ambil langsung di outlet</div>
                                        </div>
                                    </button>
                                </div>
                            </div>

                            <!-- Customer Information -->
                            <div class="bg-white p-6 rounded-2xl border border-softSand shadow-sm space-y-4">
                                <h2 class="font-extrabold text-base text-deepCharcoal">Informasi Kontak & Pengiriman</h2>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>

        function applyVoucher() {
            const code = document.getElementById('voucherInput').value.trim().toUpperCase();
            const found = DEFAULT_VOUCHERS.find(v => v.code === code);
            if (!found) {
                alertCustom('Kode promo tidak valid atau sudah kedaluwarsa.');
                return;
            }
            const subtotal = state.cart.reduce((sum, item) => sum + item.totalPrice, 0);
            if (subtotal < found.minSpend) {
                alertCustom(`Minimum transaksi untuk voucher ini adalah Rp ${found.minSpend.toLocaleString('id-ID')}`);
                return;
            }
            state.checkoutForm.appliedVoucher = found;
            render();
        }

        function removeVoucher() {
            state.checkoutForm.appliedVoucher = null;
            render();
        }

        function submitOrder() {
            const f = state.checkoutForm;
            if (!f.customerName || !f.customerPhone) {
                alertCustom('Mohon lengkapi Nama dan Nomor WhatsApp.');
                return;
            }
            if (f.fulfillmentType === 'delivery' && !f.address) {
                alertCustom('Mohon lengkapi alamat pengiriman.');
                return;
            }

            const subtotal = state.cart.reduce((sum, item) => sum + item.totalPrice, 0);
            const deliveryFee = f.fulfillmentType === 'delivery' ? 15000 : 0;
            let discount = 0;
            if (f.appliedVoucher && subtotal >= f.appliedVoucher.minSpend) {
                if (f.appliedVoucher.discountType === 'percent') {
                    discount = (subtotal * f.appliedVoucher.discountValue) / 100;
                } else {
                    discount = f.appliedVoucher.discountValue;
                }
            }
            const total = Math.max(0, subtotal + deliveryFee - discount);

            const newOrder = {
                id: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                createdAt: new Date().toISOString(),
                outletId: state.selectedOutlet.id,
                customerName: f.customerName,
                customerPhone: f.customerPhone,
                fulfillmentType: f.fulfillmentType,
                address: f.fulfillmentType === 'delivery' ? f.address : `Ambil di Outlet ${state.selectedOutlet.name}`,
                deliveryNotes: f.deliveryNotes || '-',
                items: [...state.cart],
                subtotal: subtotal,
                deliveryFee: deliveryFee,
                discount: discount,
                total: total,
                paymentMethod: f.paymentMethod,
                paymentStatus: f.paymentMethod === 'cod' ? 'pending' : 'paid',
                status: 'received',
                targetMinutes: 20,
                courier: f.fulfillmentType === 'delivery' ? 'Kurir Internal Outlet' : '-',
                auditTrail: [{ time: 'Baru saja', note: 'Pesanan Dibuat oleh Pelanggan' }]
            };

            state.orders.unshift(newOrder);
            state.cart = []; // Clear cart
            navigateTo('customer-tracking', newOrder.id);
        }

                { key: 'completed', label: 'Selesai', desc: 'Pesanan telah diterima' }

            const currentIndex = steps.findIndex(s => s.key === order.status);

            return `
                <main class="flex-grow max-w-4xl mx-auto px-4 py-12 w-full">
                    <div class="bg-white rounded-3xl border border-softSand shadow-lg p-6 sm:p-10 space-y-8">

                                            <p class="text-xs text-stone-500 mt-0.5">${step.desc}</p>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- Order Details Box -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-warmIvory/50 p-6 rounded-2xl border border-softSand">
                            <div>
                                <h3 class="font-bold text-sm text-deepCharcoal mb-3">Detail Penerima</h3>

                                    <div class="flex justify-between text-sm font-extrabold text-deepCharcoal pt-2 border-t border-softSand">
                                        <span>Total:</span>

                                                </div>
                                                ${i.variant ? `<div class="text-xs text-stone-500">Varian: ${i.variant}</div>` : ''}
                                                ${i.addons && i.addons.length > 0 ? `<div class="text-xs text-stone-400">+ ${i.addons.join(', ')}</div>` : ''}
                                                ${i.notes ? `<div class="text-xs text-chiliOrange font-bold mt-1">Catatan: ${i.notes}</div>` : ''}
                                            `).join('')}
                                        </div>
                                    </div>
                                    <div class="pt-2">
                                        ${o.status === 'received' ? `
                                            <button onclick="updateOrderStatus('${o.id}', 'cooking')" class="w-full bg-chiliOrange hover:bg-chiliOrangeHover text-white font-bold py-3 rounded-xl text-xs transition">
                                                Mulai Memasak ⏱️
                                            </button>
                                        ` : `
                                            <button onclick="updateOrderStatus('${o.id}', '${o.fulfillmentType === 'delivery' ? 'delivering' : 'ready'}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl text-xs transition">
                                                Tandai Masakan Selesai ✓
                                            </button>
                                        `}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `}
                </main>
            `;
        }

        /* ==========================================================================
           13. ADMIN MANAGEMENT & SALES ANALYTICS
           ========================================================================== */
        function renderOpsAdmin() {
            return `
                <main class="flex-grow max-w-7xl mx-auto px-4 lg:px-12 py-8 w-full space-y-8">
                    <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h1 class="text-2xl font-extrabold text-deepCharcoal">Manajemen & Laporan Penjualan</h1>
                            <p class="text-xs text-stone-500 mt-1">Kontrol stok, menu, outlet, voucher promo, dan laporan keuangan</p>
                        </div>
                        <div class="flex items-center gap-2 bg-white border border-softSand p-1.5 rounded-xl">
                            <button onclick="state.adminTab='orders'; render();" class="px-4 py-2 rounded-lg text-xs font-bold transition ${state.adminTab === 'orders' ? 'bg-chiliOrange text-white' : 'text-stone-600 hover:bg-stone-50'}">Transaksi</button>
                            <button onclick="state.adminTab='menu'; render();" class="px-4 py-2 rounded-lg text-xs font-bold transition ${state.adminTab === 'menu' ? 'bg-chiliOrange text-white' : 'text-stone-600 hover:bg-stone-50'}">Stok Menu</button>
                            <button onclick="state.adminTab='outlets'; render();" class="px-4 py-2 rounded-lg text-xs font-bold transition ${state.adminTab === 'outlets' ? 'bg-chiliOrange text-white' : 'text-stone-600 hover:bg-stone-50'}">Outlet</button>
                            <button onclick="state.adminTab='reports'; render();" class="px-4 py-2 rounded-lg text-xs font-bold transition ${state.adminTab === 'reports' ? 'bg-chiliOrange text-white' : 'text-stone-600 hover:bg-stone-50'}">Laporan</button>
                        </div>
                    </div>

                    ${state.adminTab === 'orders' ? renderAdminOrdersTab() : ''}
                    ${state.adminTab === 'menu' ? renderAdminMenuTab() : ''}
                    ${state.adminTab === 'outlets' ? renderAdminOutletsTab() : ''}
                    ${state.adminTab === 'reports' ? renderAdminReportsTab() : ''}
                </main>
            `;
        }

        function renderAdminOrdersTab() {
            return `
                <div class="bg-white rounded-3xl border border-softSand shadow-sm overflow-hidden p-6 space-y-4">
                    <h2 class="font-extrabold text-base text-deepCharcoal">Audit Trail & Riwayat Transaksi Seluruh Outlet</h2>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm">
                            <thead class="bg-warmIvory text-stone-600 font-bold text-xs uppercase border-b border-softSand">
                                <tr>
                                    <th class="p-3">ID</th>
                                    <th class="p-3">Pelanggan</th>
                                    <th class="p-3">Waktu</th>
                                    <th class="p-3">Total</th>
                                    <th class="p-3">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-softSand">
                                ${state.orders.map(o => `
                                    <tr>
                                        <td class="p-3 font-extrabold">${o.id}</td>
                                        <td class="p-3">${o.customerName}</td>
                                        <td class="p-3 text-xs text-stone-500">${new Date(o.createdAt).toLocaleTimeString()}</td>
                                        <td class="p-3 font-bold">Rp ${o.total.toLocaleString('id-ID')}</td>
                                        <td class="p-3"><span class="px-2.5 py-1 bg-stone-100 rounded text-xs font-bold uppercase">${o.status}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
        }

        function renderAdminMenuTab() {
            return `
                <div class="bg-white rounded-3xl border border-softSand shadow-sm p-6 space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="font-extrabold text-base text-deepCharcoal">Kontrol Ketersediaan Stok Menu</h2>
                        <span class="text-xs text-stone-500">Perubahan langsung berlaku di katalog pelanggan</span>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                        ${DEFAULT_PRODUCTS.map(p => {
                            const isAvailable = state.inventoryStock[p.id] !== false;
                            return `
                                <div class="p-4 rounded-2xl border border-softSand flex items-center justify-between bg-warmIvory/30">
                                    <div class="flex items-center gap-3">
                                        <img src="${p.image}" class="w-12 h-12 rounded-xl object-cover">
                                        <div>
                                            <h4 class="font-bold text-sm text-deepCharcoal">${p.name}</h4>
                                            <span class="text-xs font-bold ${isAvailable ? 'text-emerald-600' : 'text-red-500'}">${isAvailable ? 'Tersedia' : 'Habis'}</span>
                                        </div>
                                    </div>
                                    <button onclick="toggleProductStock('${p.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${isAvailable ? 'bg-red-50 text-red-600 hover:bg-red-100' : 'bg-emerald-50 text-emerald-600 hover:bg-emerald-100'}">
                                        ${isAvailable ? 'Set Habis' : 'Set Ready'}
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function toggleProductStock(productId) {
            state.inventoryStock[productId] = !state.inventoryStock[productId];
            render();
        }

        function renderAdminOutletsTab() {
            return `
                <div class="bg-white rounded-3xl border border-softSand shadow-sm p-6 space-y-6">
                    <h2 class="font-extrabold text-base text-deepCharcoal">Manajemen Outlet & Jam Operasional</h2>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        ${DEFAULT_OUTLETS.map(o => `
                            <div class="p-6 rounded-2xl border border-softSand space-y-3 bg-warmIvory/20">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-extrabold text-base text-deepCharcoal">${o.name}</h3>
                                    <span class="px-2.5 py-1 rounded-full text-xs font-bold ${o.isOpen ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">${o.isOpen ? 'Buka' : 'Tutup'}</span>
                                </div>
                                <p class="text-xs text-stone-500">${o.address}</p>
                                <p class="text-xs font-semibold text-stone-600">Jam Operasional: ${o.openTime} - ${o.closeTime}</p>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderAdminReportsTab() {
            const totalRevenue = state.orders.reduce((sum, o) => sum + o.total, 0);
            const totalOrdersCount = state.orders.length;
            const avgOrderValue = totalOrdersCount > 0 ? Math.round(totalRevenue / totalOrdersCount) : 0;

            return `
                <div class="space-y-6">
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                        <div class="bg-white p-6 rounded-3xl border border-softSand shadow-sm">
                            <span class="text-xs font-bold text-stone-400 uppercase">Total Pendapatan</span>
                            <h3 class="text-3xl font-extrabold text-deepCharcoal mt-2">Rp ${totalRevenue.toLocaleString('id-ID')}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border border-softSand shadow-sm">
                            <span class="text-xs font-bold text-stone-400 uppercase">Jumlah Transaksi</span>
                            <h3 class="text-3xl font-extrabold text-deepCharcoal mt-2">${totalOrdersCount} Pesanan</h3>
                        </div>
                        <div class="bg-white p-6 rounded-3xl border border-softSand shadow-sm">
                            <span class="text-xs font-bold text-stone-400 uppercase">Rata-rata Transaksi (AOV)</span>
                            <h3 class="text-3xl font-extrabold text-deepCharcoal mt-2">Rp ${avgOrderValue.toLocaleString('id-ID')}</h3>
                        </div>
                    </div>
                </div>
            `;
        }

        /* ==========================================================================
           14. OUTLET SELECTION MODAL & UTILITIES
           ========================================================================== */
        function openOutletModal() {
            const modalHtml = `
                <div id="outletModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-deepCharcoal/60 backdrop-blur-sm fade-in">
                    <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-softSand space-y-6">
                        <div class="flex justify-between items-center">
                            <h2 class="font-extrabold text-xl text-deepCharcoal">Pilih Outlet Terdekat</h2>
                            <button onclick="document.getElementById('outletModal').remove()" class="w-8 h-8 rounded-full bg-stone-100 font-bold text-deepCharcoal">✕</button>
                        </div>
                        <div class="space-y-3">
                            ${DEFAULT_OUTLETS.map(o => `
                                <div onclick="selectOutlet('${o.id}')" class="p-4 rounded-2xl border border-softSand hover:border-chiliOrange cursor-pointer transition flex items-center justify-between ${state.selectedOutlet.id === o.id ? 'bg-chiliOrange/5 border-chiliOrange' : 'bg-white'}">
                                    <div>
                                        <h3 class="font-bold text-sm text-deepCharcoal">${o.name}</h3>
                                        <p class="text-xs text-stone-500 mt-1">${o.address}</p>
                                    </div>
                                    <span class="text-xs font-extrabold ${o.isOpen ? 'text-emerald-600' : 'text-red-500'}">${o.isOpen ? 'Buka' : 'Tutup'}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        }

        function selectOutlet(outletId) {
            const outlet = DEFAULT_OUTLETS.find(o => o.id === outletId);
            if (outlet) {
                state.selectedOutlet = outlet;
                const modal = document.getElementById('outletModal');
                if (modal) modal.remove();
                render();
            }
        }

        function handleSearchInput(val) {
            state.searchQuery = val;
        }

        function alertCustom(msg) {
            const box = document.createElement('div');
            box.className = 'fixed bottom-6 right-6 z-50 bg-deepCharcoal text-warmIvory px-6 py-3.5 rounded-2xl shadow-xl text-sm font-semibold fade-in border border-stone-700';
            box.innerHTML = msg;
            document.body.appendChild(box);
            setTimeout(() => box.remove(), 3000);
        }

        // Initial render on window load
        window.onload = function() {
            render();
        };
    </script>
</body>
</html>
